passages:
  - citation: "1.1"
    sequence: 1
    greek: "μῆνιν ἄειδε θεὰ Πηληϊάδεω Ἀχιλῆος"
  - citation: "1.2"
    sequence: 2
    greek: "οὐλομένην ἣ μυρίʼ Ἀχαιοῖς ἄλγεʼ ἔθηκε"
  - citation: "1.3"
    sequence: 3
    greek: "πολλὰς δʼ ἰφθίμους ψυχὰς Ἄϊδι προΐαψεν"
  - citation: "1.4"
    sequence: 4
    greek: "ἡρώων αὐτοὺς δὲ ἑλώρια τεῦχε κύνεσσιν"
  - citation: "1.5"
    sequence: 5
    greek: "οἰωνοῖσί τε πᾶσι Διὸς δʼ ἐτελείετο βουλή"
  - citation: "1.6"
    sequence: 6
    greek: "ἐξ οὗ δὴ τὰ πρῶτα διαστήτην ἐρίσαντε"
  - citation: "1.7"
    sequence: 7
    greek: "Ἀτρεΐδης τε ἄναξ ἀνδρῶν καὶ δῖος Ἀχιλλεύς"
  - citation: "1.8"
    sequence: 8
    greek: "τίς τʼ ἄρ σφωε θεῶν ἔριδι ξυνέηκε μάχεσθαι"
  - citation: "1.9"
    sequence: 9
    greek: "Λητοῦς καὶ Διὸς υἱός ὃ γὰρ βασιλῆϊ χολωθεὶς"
  - citation: "1.10"
    sequence: 10
    greek: "νοῦσον ἀνὰ στρατὸν ὄρσε κακήν ὀλέκοντο δὲ λαοί"
  - citation: "1.11"
    sequence: 11
    greek: "οὕνεκα τὸν Χρύσην ἠτίμασεν ἀρητῆρα"
  - citation: "1.12"
    sequence: 12
    greek: "Ἀτρεΐδης ὃ γὰρ ἦλθε θοὰς ἐπὶ νῆας Ἀχαιῶν"
  - citation: "1.13"
    sequence: 13
    greek: "λυσόμενός τε θύγατρα φέρων τʼ ἀπερείσιʼ ἄποινα"
  - citation: "1.14"
    sequence: 14
    greek: "στέμματʼ ἔχων ἐν χερσὶν ἑκηβόλου Ἀπόλλωνος"
  - citation: "1.15"
    sequence: 15
    greek: "χρυσέῳ ἀνὰ σκήπτρῳ καὶ λίσσετο πάντας Ἀχαιούς"
  - citation: "1.16"
    sequence: 16
    greek: "Ἀτρεΐδα δὲ μάλιστα δύω κοσμήτορε λαῶν"
  - citation: "1.17"
    sequence: 17
    greek: "Ἀτρεΐδαι τε καὶ ἄλλοι ἐϋκνήμιδες Ἀχαιοί"
  - citation: "1.18"
    sequence: 18
    greek: "ὑμῖν μὲν θεοὶ δοῖεν Ὀλύμπια δώματʼ ἔχοντες"
  - citation: "1.19"
    sequence: 19
    greek: "ἐκπέρσαι Πριάμοιο πόλιν εὖ δʼ οἴκαδʼ ἱκέσθαι"
  - citation: "1.20"
    sequence: 20
    greek: "παῖδα δʼ ἐμοὶ λύσαιτε φίλην τὰ δʼ ἄποινα δέχεσθαι"
  - citation: "1.21"
    sequence: 21
    greek: "ἁζόμενοι Διὸς υἱὸν ἑκηβόλον Ἀπόλλωνα"
  - citation: "1.22"
    sequence: 22
    greek: "ἔνθʼ ἄλλοι μὲν πάντες ἐπευφήμησαν Ἀχαιοὶ"
  - citation: "1.23"
    sequence: 23
    greek: "αἰδεῖσθαί θʼ ἱερῆα καὶ ἀγλαὰ δέχθαι ἄποινα"
  - citation: "1.24"
    sequence: 24
    greek: "ἀλλʼ οὐκ Ἀτρεΐδῃ Ἀγαμέμνονι ἥνδανε θυμῷ"
  - citation: "1.25"
    sequence: 25
    greek: "ἀλλὰ κακῶς ἀφίει κρατερὸν δʼ ἐπὶ μῦθον ἔτελλε"
  - citation: "1.26"
    sequence: 26
    greek: "μή σε γέρον κοίλῃσιν ἐγὼ παρὰ νηυσὶ κιχείω"
  - citation: "1.27"
    sequence: 27
    greek: "ἢ νῦν δηθύνοντʼ ἢ ὕστερον αὖτις ἰόντα"
  - citation: "1.28"
    sequence: 28
    greek: "μή νύ τοι οὐ χραίσμῃ σκῆπτρον καὶ στέμμα θεοῖο"
  - citation: "1.29"
    sequence: 29
    greek: "τὴν δʼ ἐγὼ οὐ λύσω πρίν μιν καὶ γῆρας ἔπεισιν"
  - citation: "1.30"
    sequence: 30
    greek: "ἡμετέρῳ ἐνὶ οἴκῳ ἐν Ἄργεϊ τηλόθι πάτρης"
  - citation: "1.31"
    sequence: 31
    greek: "ἱστὸν ἐποιχομένην καὶ ἐμὸν λέχος ἀντιόωσαν"
  - citation: "1.32"
    sequence: 32
    greek: "ἀλλʼ ἴθι μή μʼ ἐρέθιζε σαώτερος ὥς κε νέηαι"
  - citation: "1.33"
    sequence: 33
    greek: "ὣς ἔφατʼ ἔδεισεν δʼ ὃ γέρων καὶ ἐπείθετο μύθῳ"
  - citation: "1.34"
    sequence: 34
    greek: "βῆ δʼ ἀκέων παρὰ θῖνα πολυφλοίσβοιο θαλάσσης"
  - citation: "1.35"
    sequence: 35
    greek: "πολλὰ δʼ ἔπειτʼ ἀπάνευθε κιὼν ἠρᾶθʼ ὁ γεραιὸς"
  - citation: "1.36"
    sequence: 36
    greek: "Ἀπόλλωνι ἄνακτι τὸν ἠΰκομος τέκε Λητώ"
  - citation: "1.37"
    sequence: 37
    greek: "κλῦθί μευ ἀργυρότοξʼ ὃς Χρύσην ἀμφιβέβηκας"
  - citation: "1.38"
    sequence: 38
    greek: "Κίλλαν τε ζαθέην Τενέδοιό τε ἶφι ἀνάσσεις"
  - citation: "1.39"
    sequence: 39
    greek: "Σμινθεῦ εἴ ποτέ τοι χαρίεντʼ ἐπὶ νηὸν ἔρεψα"
  - citation: "1.40"
    sequence: 40
    greek: "ἢ εἰ δή ποτέ τοι κατὰ πίονα μηρίʼ ἔκηα"
  - citation: "1.41"
    sequence: 41
    greek: "ταύρων ἠδʼ αἰγῶν τὸ δέ μοι κρήηνον ἐέλδωρ"
  - citation: "1.42"
    sequence: 42
    greek: "τίσειαν Δαναοὶ ἐμὰ δάκρυα σοῖσι βέλεσσιν"
  - citation: "1.43"
    sequence: 43
    greek: "ὣς ἔφατʼ εὐχόμενος τοῦ δʼ ἔκλυε Φοῖβος Ἀπόλλων"
  - citation: "1.44"
    sequence: 44
    greek: "βῆ δὲ κατʼ Οὐλύμποιο καρήνων χωόμενος κῆρ"
  - citation: "1.45"
    sequence: 45
    greek: "τόξʼ ὤμοισιν ἔχων ἀμφηρεφέα τε φαρέτρην"
  - citation: "1.46"
    sequence: 46
    greek: "ἔκλαγξαν δʼ ἄρʼ ὀϊστοὶ ἐπʼ ὤμων χωομένοιο"
  - citation: "1.47"
    sequence: 47
    greek: "αὐτοῦ κινηθέντος ὃ δʼ ἤϊε νυκτὶ ἐοικώς"
  - citation: "1.48"
    sequence: 48
    greek: "ἕζετʼ ἔπειτʼ ἀπάνευθε νεῶν μετὰ δʼ ἰὸν ἕηκε"
  - citation: "1.49"
    sequence: 49
    greek: "δεινὴ δὲ κλαγγὴ γένετʼ ἀργυρέοιο βιοῖο"
  - citation: "1.50"
    sequence: 50
    greek: "οὐρῆας μὲν πρῶτον ἐπῴχετο καὶ κύνας ἀργούς"
  - citation: "1.51"
    sequence: 51
    greek: "αὐτὰρ ἔπειτʼ αὐτοῖσι βέλος ἐχεπευκὲς ἐφιεὶς"
  - citation: "1.52"
    sequence: 52
    greek: "βάλλʼ αἰεὶ δὲ πυραὶ νεκύων καίοντο θαμειαί"
  - citation: "1.53"
    sequence: 53
    greek: "ἐννῆμαρ μὲν ἀνὰ στρατὸν ᾤχετο κῆλα θεοῖο"
  - citation: "1.54"
    sequence: 54
    greek: "τῇ δεκάτῃ δʼ ἀγορὴν δὲ καλέσσατο λαὸν Ἀχιλλεύς"
  - citation: "1.55"
    sequence: 55
    greek: "τῷ γὰρ ἐπὶ φρεσὶ θῆκε θεὰ λευκώλενος Ἥρη"
  - citation: "1.56"
    sequence: 56
    greek: "κήδετο γὰρ Δαναῶν ὅτι ῥα θνήσκοντας ὁρᾶτο"
  - citation: "1.57"
    sequence: 57
    greek: "οἳ δʼ ἐπεὶ οὖν ἤγερθεν ὁμηγερέες τε γένοντο"
  - citation: "1.58"
    sequence: 58
    greek: "τοῖσι δʼ ἀνιστάμενος μετέφη πόδας ὠκὺς Ἀχιλλεύς"
  - citation: "1.59"
    sequence: 59
    greek: "Ἀτρεΐδη νῦν ἄμμε παλιμπλαγχθέντας ὀΐω"
  - citation: "1.60"
    sequence: 60
    greek: "ἂψ ἀπονοστήσειν εἴ κεν θάνατόν γε φύγοιμεν"
  - citation: "1.61"
    sequence: 61
    greek: "εἰ δὴ ὁμοῦ πόλεμός τε δαμᾷ καὶ λοιμὸς Ἀχαιούς"
  - citation: "1.62"
    sequence: 62
    greek: "ἀλλʼ ἄγε δή τινα μάντιν ἐρείομεν ἢ ἱερῆα"
  - citation: "1.63"
    sequence: 63
    greek: "ἢ καὶ ὀνειροπόλον καὶ γάρ τʼ ὄναρ ἐκ Διός ἐστιν"
  - citation: "1.64"
    sequence: 64
    greek: "ὅς κʼ εἴποι ὅ τι τόσσον ἐχώσατο Φοῖβος Ἀπόλλων"
  - citation: "1.65"
    sequence: 65
    greek: "εἴτʼ ἄρʼ ὅ γʼ εὐχωλῆς ἐπιμέμφεται ἠδʼ ἑκατόμβης"
  - citation: "1.66"
    sequence: 66
    greek: "αἴ κέν πως ἀρνῶν κνίσης αἰγῶν τε τελείων"
  - citation: "1.67"
    sequence: 67
    greek: "βούλεται ἀντιάσας ἡμῖν ἀπὸ λοιγὸν ἀμῦναι"
  - citation: "1.68"
    sequence: 68
    greek: "ἤτοι ὅ γʼ ὣς εἰπὼν κατʼ ἄρʼ ἕζετο τοῖσι δʼ ἀνέστη"
  - citation: "1.69"
    sequence: 69
    greek: "Κάλχας Θεστορίδης οἰωνοπόλων ὄχʼ ἄριστος"
  - citation: "1.70"
    sequence: 70
    greek: "ὃς ᾔδη τά τʼ ἐόντα τά τʼ ἐσσόμενα πρό τʼ ἐόντα"
  - citation: "1.71"
    sequence: 71
    greek: "καὶ νήεσσʼ ἡγήσατʼ Ἀχαιῶν Ἴλιον εἴσω"
  - citation: "1.72"
    sequence: 72
    greek: "ἣν διὰ μαντοσύνην τήν οἱ πόρε Φοῖβος Ἀπόλλων"
  - citation: "1.73"
    sequence: 73
    greek: "ὅ σφιν ἐὺ φρονέων ἀγορήσατο καὶ μετέειπεν"
  - citation: "1.74"
    sequence: 74
    greek: "ὦ Ἀχιλεῦ κέλεαί με Διῒ φίλε μυθήσασθαι"
  - citation: "1.75"
    sequence: 75
    greek: "μῆνιν Ἀπόλλωνος ἑκατηβελέταο ἄνακτος"
  - citation: "1.76"
    sequence: 76
    greek: "τοὶ γὰρ ἐγὼν ἐρέω σὺ δὲ σύνθεο καί μοι ὄμοσσον"
  - citation: "1.77"
    sequence: 77
    greek: "ἦ μέν μοι πρόφρων ἔπεσιν καὶ χερσὶν ἀρήξειν"
  - citation: "1.78"
    sequence: 78
    greek: "ἦ γὰρ ὀΐομαι ἄνδρα χολωσέμεν ὃς μέγα πάντων"
  - citation: "1.79"
    sequence: 79
    greek: "Ἀργείων κρατέει καί οἱ πείθονται Ἀχαιοί"
  - citation: "1.80"
    sequence: 80
    greek: "κρείσσων γὰρ βασιλεὺς ὅτε χώσεται ἀνδρὶ χέρηϊ"
  - citation: "1.81"
    sequence: 81
    greek: "εἴ περ γάρ τε χόλον γε καὶ αὐτῆμαρ καταπέψῃ"
  - citation: "1.82"
    sequence: 82
    greek: "ἀλλά τε καὶ μετόπισθεν ἔχει κότον ὄφρα τελέσσῃ"
  - citation: "1.83"
    sequence: 83
    greek: "ἐν στήθεσσιν ἑοῖσι σὺ δὲ φράσαι εἴ με σαώσεις"
  - citation: "1.84"
    sequence: 84
    greek: "τὸν δʼ ἀπαμειβόμενος προσέφη πόδας ὠκὺς Ἀχιλλεύς"
  - citation: "1.85"
    sequence: 85
    greek: "θαρσήσας μάλα εἰπὲ θεοπρόπιον ὅ τι οἶσθα"
  - citation: "1.86"
    sequence: 86
    greek: "οὐ μὰ γὰρ Ἀπόλλωνα Διῒ φίλον ᾧ τε σὺ Κάλχαν"
  - citation: "1.87"
    sequence: 87
    greek: "εὐχόμενος Δαναοῖσι θεοπροπίας ἀναφαίνεις"
  - citation: "1.88"
    sequence: 88
    greek: "οὔ τις ἐμεῦ ζῶντος καὶ ἐπὶ χθονὶ δερκομένοιο"
  - citation: "1.89"
    sequence: 89
    greek: "σοὶ κοίλῃς παρὰ νηυσί βαρείας χεῖρας ἐποίσει"
  - citation: "1.90"
    sequence: 90
    greek: "συμπάντων Δαναῶν οὐδʼ ἢν Ἀγαμέμνονα εἴπῃς"
  - citation: "1.91"
    sequence: 91
    greek: "ὃς νῦν πολλὸν ἄριστος Ἀχαιῶν εὔχεται εἶναι"
  - citation: "1.92"
    sequence: 92
    greek: "καὶ τότε δὴ θάρσησε καὶ ηὔδα μάντις ἀμύμων"
  - citation: "1.93"
    sequence: 93
    greek: "οὔ τʼ ἄρ ὅ γʼ εὐχωλῆς ἐπιμέμφεται οὐδʼ ἑκατόμβης"
  - citation: "1.94"
    sequence: 94
    greek: "ἀλλʼ ἕνεκʼ ἀρητῆρος ὃν ἠτίμησʼ Ἀγαμέμνων"
  - citation: "1.95"
    sequence: 95
    greek: "οὐδʼ ἀπέλυσε θύγατρα καὶ οὐκ ἀπεδέξατʼ ἄποινα"
  - citation: "1.96"
    sequence: 96
    greek: "τοὔνεκʼ ἄρʼ ἄλγεʼ ἔδωκεν ἑκηβόλος ἠδʼ ἔτι δώσει"
  - citation: "1.97"
    sequence: 97
    greek: "οὐδʼ ὅ γε πρὶν Δαναοῖσιν ἀεικέα λοιγὸν ἀπώσει"
  - citation: "1.98"
    sequence: 98
    greek: "πρίν γʼ ἀπὸ πατρὶ φίλῳ δόμεναι ἑλικώπιδα κούρην"
  - citation: "1.99"
    sequence: 99
    greek: "ἀπριάτην ἀνάποινον ἄγειν θʼ ἱερὴν ἑκατόμβην"
  - citation: "1.100"
    sequence: 100
    greek: "ἐς Χρύσην τότε κέν μιν ἱλασσάμενοι πεπίθοιμεν"
  - citation: "1.101"
    sequence: 101
    greek: "ἤτοι ὅ γʼ ὣς εἰπὼν κατʼ ἄρʼ ἕζετο τοῖσι δʼ ἀνέστη"
  - citation: "1.102"
    sequence: 102
    greek: "ἥρως Ἀτρεΐδης εὐρὺ κρείων Ἀγαμέμνων"
  - citation: "1.103"
    sequence: 103
    greek: "ἀχνύμενος μένεος δὲ μέγα φρένες ἀμφιμέλαιναι"
  - citation: "1.104"
    sequence: 104
    greek: "πίμπλαντʼ ὄσσε δέ οἱ πυρὶ λαμπετόωντι ἐΐκτην"
  - citation: "1.105"
    sequence: 105
    greek: "Κάλχαντα πρώτιστα κάκʼ ὀσσόμενος προσέειπε"
  - citation: "1.106"
    sequence: 106
    greek: "μάντι κακῶν οὐ πώ ποτέ μοι τὸ κρήγυον εἶπας"
  - citation: "1.107"
    sequence: 107
    greek: "αἰεί τοι τὰ κάκʼ ἐστὶ φίλα φρεσὶ μαντεύεσθαι"
  - citation: "1.108"
    sequence: 108
    greek: "ἐσθλὸν δʼ οὔτέ τί πω εἶπας ἔπος οὔτʼ ἐτέλεσσας"
  - citation: "1.109"
    sequence: 109
    greek: "καὶ νῦν ἐν Δαναοῖσι θεοπροπέων ἀγορεύεις"
  - citation: "1.110"
    sequence: 110
    greek: "ὡς δὴ τοῦδʼ ἕνεκά σφιν ἑκηβόλος ἄλγεα τεύχει"
  - citation: "1.111"
    sequence: 111
    greek: "οὕνεκʼ ἐγὼ κούρης Χρυσηΐδος ἀγλάʼ ἄποινα"
  - citation: "1.112"
    sequence: 112
    greek: "οὐκ ἔθελον δέξασθαι ἐπεὶ πολὺ βούλομαι αὐτὴν"
  - citation: "1.113"
    sequence: 113
    greek: "οἴκοι ἔχειν καὶ γάρ ῥα Κλυταιμνήστρης προβέβουλα"
  - citation: "1.114"
    sequence: 114
    greek: "κουριδίης ἀλόχου ἐπεὶ οὔ ἑθέν ἐστι χερείων"
  - citation: "1.115"
    sequence: 115
    greek: "οὐ δέμας οὐδὲ φυήν οὔτʼ ἂρ φρένας οὔτέ τι ἔργα"
  - citation: "1.116"
    sequence: 116
    greek: "ἀλλὰ καὶ ὧς ἐθέλω δόμεναι πάλιν εἰ τό γʼ ἄμεινον"
  - citation: "1.117"
    sequence: 117
    greek: "βούλομʼ ἐγὼ λαὸν σῶν ἔμμεναι ἢ ἀπολέσθαι"
  - citation: "1.118"
    sequence: 118
    greek: "αὐτὰρ ἐμοὶ γέρας αὐτίχʼ ἑτοιμάσατʼ ὄφρα μὴ οἶος"
  - citation: "1.119"
    sequence: 119
    greek: "Ἀργείων ἀγέραστος ἔω ἐπεὶ οὐδὲ ἔοικε"
  - citation: "1.120"
    sequence: 120
    greek: "λεύσσετε γὰρ τό γε πάντες ὅ μοι γέρας ἔρχεται ἄλλῃ"
  - citation: "1.121"
    sequence: 121
    greek: "τὸν δʼ ἠμείβετʼ ἔπειτα ποδάρκης δῖος Ἀχιλλεύς"
  - citation: "1.122"
    sequence: 122
    greek: "Ἀτρεΐδη κύδιστε φιλοκτεανώτατε πάντων"
  - citation: "1.123"
    sequence: 123
    greek: "πῶς γάρ τοι δώσουσι γέρας μεγάθυμοι Ἀχαιοί"
  - citation: "1.124"
    sequence: 124
    greek: "οὐδέ τί που ἴδμεν ξυνήϊα κείμενα πολλά"
  - citation: "1.125"
    sequence: 125
    greek: "ἀλλὰ τὰ μὲν πολίων ἐξεπράθομεν τὰ δέδασται"
  - citation: "1.126"
    sequence: 126
    greek: "λαοὺς δʼ οὐκ ἐπέοικε παλίλλογα ταῦτʼ ἐπαγείρειν"
  - citation: "1.127"
    sequence: 127
    greek: "ἀλλὰ σὺ μὲν νῦν τήνδε θεῷ πρόες αὐτὰρ Ἀχαιοὶ"
  - citation: "1.128"
    sequence: 128
    greek: "τριπλῇ τετραπλῇ τʼ ἀποτείσομεν αἴ κέ ποθι Ζεὺς"
  - citation: "1.129"
    sequence: 129
    greek: "δῷσι πόλιν Τροίην εὐτείχεον ἐξαλαπάξαι"
  - citation: "1.130"
    sequence: 130
    greek: "τὸν δʼ ἀπαμειβόμενος προσέφη κρείων Ἀγαμέμνων"
  - citation: "1.131"
    sequence: 131
    greek: "μὴ δʼ οὕτως ἀγαθός περ ἐὼν θεοείκελʼ Ἀχιλλεῦ"
  - citation: "1.132"
    sequence: 132
    greek: "κλέπτε νόῳ ἐπεὶ οὐ παρελεύσεαι οὐδέ με πείσεις"
  - citation: "1.133"
    sequence: 133
    greek: "ἦ ἐθέλεις ὄφρʼ αὐτὸς ἔχῃς γέρας αὐτὰρ ἔμʼ αὔτως"
  - citation: "1.134"
    sequence: 134
    greek: "ἧσθαι δευόμενον κέλεαι δέ με τήνδʼ ἀποδοῦναι"
  - citation: "1.135"
    sequence: 135
    greek: "ἀλλʼ εἰ μὲν δώσουσι γέρας μεγάθυμοι Ἀχαιοὶ"
  - citation: "1.136"
    sequence: 136
    greek: "ἄρσαντες κατὰ θυμὸν ὅπως ἀντάξιον ἔσται"
  - citation: "1.137"
    sequence: 137
    greek: "εἰ δέ κε μὴ δώωσιν ἐγὼ δέ κεν αὐτὸς ἕλωμαι"
  - citation: "1.138"
    sequence: 138
    greek: "ἢ τεὸν ἢ Αἴαντος ἰὼν γέρας ἢ Ὀδυσῆος"
  - citation: "1.139"
    sequence: 139
    greek: "ἄξω ἑλών ὃ δέ κεν κεχολώσεται ὅν κεν ἵκωμαι"
  - citation: "1.140"
    sequence: 140
    greek: "ἀλλʼ ἤτοι μὲν ταῦτα μεταφρασόμεσθα καὶ αὖτις"
  - citation: "1.141"
    sequence: 141
    greek: "νῦν δʼ ἄγε νῆα μέλαιναν ἐρύσσομεν εἰς ἅλα δῖαν"
  - citation: "1.142"
    sequence: 142
    greek: "ἐν δʼ ἐρέτας ἐπιτηδὲς ἀγείρομεν ἐς δʼ ἑκατόμβην"
  - citation: "1.143"
    sequence: 143
    greek: "θείομεν ἂν δʼ αὐτὴν Χρυσηΐδα καλλιπάρῃον"
  - citation: "1.144"
    sequence: 144
    greek: "βήσομεν εἷς δέ τις ἀρχὸς ἀνὴρ βουληφόρος ἔστω"
  - citation: "1.145"
    sequence: 145
    greek: "ἢ Αἴας ἢ Ἰδομενεὺς ἢ δῖος Ὀδυσσεὺς"
  - citation: "1.146"
    sequence: 146
    greek: "ἠὲ σὺ Πηλεΐδη πάντων ἐκπαγλότατʼ ἀνδρῶν"
  - citation: "1.147"
    sequence: 147
    greek: "ὄφρʼ ἥμιν ἑκάεργον ἱλάσσεαι ἱερὰ ῥέξας"
  - citation: "1.148"
    sequence: 148
    greek: "τὸν δʼ ἄρʼ ὑπόδρα ἰδὼν προσέφη πόδας ὠκὺς Ἀχιλλεύς"
  - citation: "1.149"
    sequence: 149
    greek: "ὤ μοι ἀναιδείην ἐπιειμένε κερδαλεόφρον"
  - citation: "1.150"
    sequence: 150
    greek: "πῶς τίς τοι πρόφρων ἔπεσιν πείθηται Ἀχαιῶν"
  - citation: "1.151"
    sequence: 151
    greek: "ἢ ὁδὸν ἐλθέμεναι ἢ ἀνδράσιν ἶφι μάχεσθαι"
  - citation: "1.152"
    sequence: 152
    greek: "οὐ γὰρ ἐγὼ Τρώων ἕνεκʼ ἤλυθον αἰχμητάων"
  - citation: "1.153"
    sequence: 153
    greek: "δεῦρο μαχησόμενος ἐπεὶ οὔ τί μοι αἴτιοί εἰσιν"
  - citation: "1.154"
    sequence: 154
    greek: "οὐ γὰρ πώποτʼ ἐμὰς βοῦς ἤλασαν οὐδὲ μὲν ἵππους"
  - citation: "1.155"
    sequence: 155
    greek: "οὐδέ ποτʼ ἐν Φθίῃ ἐριβώλακι βωτιανείρῃ"
  - citation: "1.156"
    sequence: 156
    greek: "καρπὸν ἐδηλήσαντʼ ἐπεὶ ἦ μάλα πολλὰ μεταξὺ"
  - citation: "1.157"
    sequence: 157
    greek: "οὔρεά τε σκιόεντα θάλασσά τε ἠχήεσσα"
  - citation: "1.158"
    sequence: 158
    greek: "ἀλλὰ σοὶ ὦ μέγʼ ἀναιδὲς ἅμʼ ἑσπόμεθʼ ὄφρα σὺ χαίρῃς"
  - citation: "1.159"
    sequence: 159
    greek: "τιμὴν ἀρνύμενοι Μενελάῳ σοί τε κυνῶπα"
  - citation: "1.160"
    sequence: 160
    greek: "πρὸς Τρώων τῶν οὔ τι μετατρέπῃ οὐδʼ ἀλεγίζεις"
  - citation: "1.161"
    sequence: 161
    greek: "καὶ δή μοι γέρας αὐτὸς ἀφαιρήσεσθαι ἀπειλεῖς"
  - citation: "1.162"
    sequence: 162
    greek: "ᾧ ἔπι πολλὰ μόγησα δόσαν δέ μοι υἷες Ἀχαιῶν"
  - citation: "1.163"
    sequence: 163
    greek: "οὐ μὲν σοί ποτε ἶσον ἔχω γέρας ὁππότʼ Ἀχαιοὶ"
  - citation: "1.164"
    sequence: 164
    greek: "Τρώων ἐκπέρσωσʼ εὖ ναιόμενον πτολίεθρον"
  - citation: "1.165"
    sequence: 165
    greek: "ἀλλὰ τὸ μὲν πλεῖον πολυάϊκος πολέμοιο"
  - citation: "1.166"
    sequence: 166
    greek: "χεῖρες ἐμαὶ διέπουσʼ ἀτὰρ ἤν ποτε δασμὸς ἵκηται"
  - citation: "1.167"
    sequence: 167
    greek: "σοὶ τὸ γέρας πολὺ μεῖζον ἐγὼ δʼ ὀλίγον τε φίλον τε"
  - citation: "1.168"
    sequence: 168
    greek: "ἔρχομʼ ἔχων ἐπὶ νῆας ἐπεί κε κάμω πολεμίζων"
  - citation: "1.169"
    sequence: 169
    greek: "νῦν δʼ εἶμι Φθίην δʼ ἐπεὶ ἦ πολὺ φέρτερόν ἐστιν"
  - citation: "1.170"
    sequence: 170
    greek: "οἴκαδʼ ἴμεν σὺν νηυσὶ κορωνίσιν οὐδέ σʼ ὀΐω"
  - citation: "1.171"
    sequence: 171
    greek: "ἐνθάδʼ ἄτιμος ἐὼν ἄφενος καὶ πλοῦτον ἀφύξειν"
  - citation: "1.172"
    sequence: 172
    greek: "τὸν δʼ ἠμείβετʼ ἔπειτα ἄναξ ἀνδρῶν Ἀγαμέμνων"
  - citation: "1.173"
    sequence: 173
    greek: "φεῦγε μάλʼ εἴ τοι θυμὸς ἐπέσσυται οὐδέ σʼ ἔγωγε"
  - citation: "1.174"
    sequence: 174
    greek: "λίσσομαι εἵνεκʼ ἐμεῖο μένειν πάρʼ ἔμοιγε καὶ ἄλλοι"
  - citation: "1.175"
    sequence: 175
    greek: "οἵ κέ με τιμήσουσι μάλιστα δὲ μητίετα Ζεύς"
  - citation: "1.176"
    sequence: 176
    greek: "ἔχθιστος δέ μοί ἐσσι διοτρεφέων βασιλήων"
  - citation: "1.177"
    sequence: 177
    greek: "αἰεὶ γάρ τοι ἔρις τε φίλη πόλεμοί τε μάχαι τε"
  - citation: "1.178"
    sequence: 178
    greek: "εἰ μάλα καρτερός ἐσσι θεός που σοὶ τό γʼ ἔδωκεν"
  - citation: "1.179"
    sequence: 179
    greek: "οἴκαδʼ ἰὼν σὺν νηυσί τε σῇς καὶ σοῖς ἑτάροισι"
  - citation: "1.180"
    sequence: 180
    greek: "Μυρμιδόνεσσιν ἄνασσε σέθεν δʼ ἐγὼ οὐκ ἀλεγίζω"
  - citation: "1.181"
    sequence: 181
    greek: "οὐδʼ ὄθομαι κοτέοντος ἀπειλήσω δέ τοι ὧδε"
  - citation: "1.182"
    sequence: 182
    greek: "ὡς ἔμʼ ἀφαιρεῖται Χρυσηΐδα Φοῖβος Ἀπόλλων"
  - citation: "1.183"
    sequence: 183
    greek: "τὴν μὲν ἐγὼ σὺν νηΐ τʼ ἐμῇ καὶ ἐμοῖς ἑτάροισι"
  - citation: "1.184"
    sequence: 184
    greek: "πέμψω ἐγὼ δέ κʼ ἄγω Βρισηΐδα καλλιπάρῃον"
  - citation: "1.185"
    sequence: 185
    greek: "αὐτὸς ἰὼν κλισίην δὲ τὸ σὸν γέρας ὄφρʼ ἐῢ εἰδῇς"
  - citation: "1.186"
    sequence: 186
    greek: "ὅσσον φέρτερός εἰμι σέθεν στυγέῃ δὲ καὶ ἄλλος"
  - citation: "1.187"
    sequence: 187
    greek: "ἶσον ἐμοὶ φάσθαι καὶ ὁμοιωθήμεναι ἄντην"
  - citation: "1.188"
    sequence: 188
    greek: "ὣς φάτο Πηλεΐωνι δʼ ἄχος γένετʼ ἐν δέ οἱ ἦτορ"
  - citation: "1.189"
    sequence: 189
    greek: "στήθεσσιν λασίοισι διάνδιχα μερμήριξεν"
  - citation: "1.190"
    sequence: 190
    greek: "ἢ ὅ γε φάσγανον ὀξὺ ἐρυσσάμενος παρὰ μηροῦ"
  - citation: "1.191"
    sequence: 191
    greek: "τοὺς μὲν ἀναστήσειεν ὃ δʼ Ἀτρεΐδην ἐναρίζοι"
  - citation: "1.192"
    sequence: 192
    greek: "ἦε χόλον παύσειεν ἐρητύσειέ τε θυμόν"
  - citation: "1.193"
    sequence: 193
    greek: "ἧος ὃ ταῦθʼ ὥρμαινε κατὰ φρένα καὶ κατὰ θυμόν"
  - citation: "1.194"
    sequence: 194
    greek: "ἕλκετο δʼ ἐκ κολεοῖο μέγα ξίφος ἦλθε δʼ Ἀθήνη"
  - citation: "1.195"
    sequence: 195
    greek: "οὐρανόθεν πρὸ γὰρ ἧκε θεὰ λευκώλενος Ἥρη"
  - citation: "1.196"
    sequence: 196
    greek: "ἄμφω ὁμῶς θυμῷ φιλέουσά τε κηδομένη τε"
  - citation: "1.197"
    sequence: 197
    greek: "στῆ δʼ ὄπιθεν ξανθῆς δὲ κόμης ἕλε Πηλεΐωνα"
  - citation: "1.198"
    sequence: 198
    greek: "οἴῳ φαινομένη τῶν δʼ ἄλλων οὔ τις ὁρᾶτο"
  - citation: "1.199"
    sequence: 199
    greek: "θάμβησεν δʼ Ἀχιλεύς μετὰ δʼ ἐτράπετʼ αὐτίκα δʼ ἔγνω"
  - citation: "1.200"
    sequence: 200
    greek: "Παλλάδʼ Ἀθηναίην δεινὼ δέ οἱ ὄσσε φάανθεν"
  - citation: "1.201"
    sequence: 201
    greek: "καί μιν φωνήσας ἔπεα πτερόεντα προσηύδα"
  - citation: "1.202"
    sequence: 202
    greek: "τίπτʼ αὖτʼ αἰγιόχοιο Διὸς τέκος εἰλήλουθας"
  - citation: "1.203"
    sequence: 203
    greek: "ἦ ἵνα ὕβριν ἴδῃ Ἀγαμέμνονος Ἀτρεΐδαο"
  - citation: "1.204"
    sequence: 204
    greek: "ἀλλʼ ἔκ τοι ἐρέω τὸ δὲ καὶ τελέεσθαι ὀΐω"
  - citation: "1.205"
    sequence: 205
    greek: "ᾗς ὑπεροπλίῃσι τάχʼ ἄν ποτε θυμὸν ὀλέσσῃ"
  - citation: "1.206"
    sequence: 206
    greek: "τὸν δʼ αὖτε προσέειπε θεὰ γλαυκῶπις Ἀθήνη"
  - citation: "1.207"
    sequence: 207
    greek: "ἦλθον ἐγὼ παύσουσα τὸ σὸν μένος αἴ κε πίθηαι"
  - citation: "1.208"
    sequence: 208
    greek: "οὐρανόθεν πρὸ δέ μʼ ἧκε θεὰ λευκώλενος Ἥρη"
  - citation: "1.209"
    sequence: 209
    greek: "ἄμφω ὁμῶς θυμῷ φιλέουσά τε κηδομένη τε"
  - citation: "1.210"
    sequence: 210
    greek: "ἀλλʼ ἄγε λῆγʼ ἔριδος μηδὲ ξίφος ἕλκεο χειρί"
  - citation: "1.211"
    sequence: 211
    greek: "ἀλλʼ ἤτοι ἔπεσιν μὲν ὀνείδισον ὡς ἔσεταί περ"
  - citation: "1.212"
    sequence: 212
    greek: "ὧδε γὰρ ἐξερέω τὸ δὲ καὶ τετελεσμένον ἔσται"
  - citation: "1.213"
    sequence: 213
    greek: "καί ποτέ τοι τρὶς τόσσα παρέσσεται ἀγλαὰ δῶρα"
  - citation: "1.214"
    sequence: 214
    greek: "ὕβριος εἵνεκα τῆσδε σὺ δʼ ἴσχεο πείθεο δʼ ἡμῖν"
  - citation: "1.215"
    sequence: 215
    greek: "τὴν δʼ ἀπαμειβόμενος προσέφη πόδας ὠκὺς Ἀχιλλεύς"
  - citation: "1.216"
    sequence: 216
    greek: "χρὴ μὲν σφωΐτερόν γε θεὰ ἔπος εἰρύσσασθαι"
  - citation: "1.217"
    sequence: 217
    greek: "καὶ μάλα περ θυμῷ κεχολωμένον ὧς γὰρ ἄμεινον"
  - citation: "1.218"
    sequence: 218
    greek: "ὅς κε θεοῖς ἐπιπείθηται μάλα τʼ ἔκλυον αὐτοῦ"
  - citation: "1.219"
    sequence: 219
    greek: "ἦ καὶ ἐπʼ ἀργυρέῃ κώπῃ σχέθε χεῖρα βαρεῖαν"
  - citation: "1.220"
    sequence: 220
    greek: "ἂψ δʼ ἐς κουλεὸν ὦσε μέγα ξίφος οὐδʼ ἀπίθησε"
  - citation: "1.221"
    sequence: 221
    greek: "μύθῳ Ἀθηναίης ἣ δʼ Οὔλυμπον δὲ βεβήκει"
  - citation: "1.222"
    sequence: 222
    greek: "δώματʼ ἐς αἰγιόχοιο Διὸς μετὰ δαίμονας ἄλλους"
  - citation: "1.223"
    sequence: 223
    greek: "Πηλεΐδης δʼ ἐξαῦτις ἀταρτηροῖς ἐπέεσσιν"
  - citation: "1.224"
    sequence: 224
    greek: "Ἀτρεΐδην προσέειπε καὶ οὔ πω λῆγε χόλοιο"
  - citation: "1.225"
    sequence: 225
    greek: "οἰνοβαρές κυνὸς ὄμματʼ ἔχων κραδίην δʼ ἐλάφοιο"
  - citation: "1.226"
    sequence: 226
    greek: "οὔτέ ποτʼ ἐς πόλεμον ἅμα λαῷ θωρηχθῆναι"
  - citation: "1.227"
    sequence: 227
    greek: "οὔτε λόχον δʼ ἰέναι σὺν ἀριστήεσσιν Ἀχαιῶν"
  - citation: "1.228"
    sequence: 228
    greek: "τέτληκας θυμῷ τὸ δέ τοι κὴρ εἴδεται εἶναι"
  - citation: "1.229"
    sequence: 229
    greek: "ἦ πολὺ λώϊόν ἐστι κατὰ στρατὸν εὐρὺν Ἀχαιῶν"
  - citation: "1.230"
    sequence: 230
    greek: "δῶρʼ ἀποαιρεῖσθαι ὅς τις σέθεν ἀντίον εἴπῃ"
  - citation: "1.231"
    sequence: 231
    greek: "δημοβόρος βασιλεὺς ἐπεὶ οὐτιδανοῖσιν ἀνάσσεις"
  - citation: "1.232"
    sequence: 232
    greek: "ἦ γὰρ ἂν Ἀτρεΐδη νῦν ὕστατα λωβήσαιο"
  - citation: "1.233"
    sequence: 233
    greek: "ἀλλʼ ἔκ τοι ἐρέω καὶ ἐπὶ μέγαν ὅρκον ὀμοῦμαι"
  - citation: "1.234"
    sequence: 234
    greek: "ναὶ μὰ τόδε σκῆπτρον τὸ μὲν οὔ ποτε φύλλα καὶ ὄζους"
  - citation: "1.235"
    sequence: 235
    greek: "φύσει ἐπεὶ δὴ πρῶτα τομὴν ἐν ὄρεσσι λέλοιπεν"
  - citation: "1.236"
    sequence: 236
    greek: "οὐδʼ ἀναθηλήσει περὶ γάρ ῥά ἑ χαλκὸς ἔλεψε"
  - citation: "1.237"
    sequence: 237
    greek: "φύλλά τε καὶ φλοιόν νῦν αὖτέ μιν υἷες Ἀχαιῶν"
  - citation: "1.238"
    sequence: 238
    greek: "ἐν παλάμῃς φορέουσι δικασπόλοι οἵ τε θέμιστας"
  - citation: "1.239"
    sequence: 239
    greek: "πρὸς Διὸς εἰρύαται ὃ δέ τοι μέγας ἔσσεται ὅρκος"
  - citation: "1.240"
    sequence: 240
    greek: "ἦ ποτʼ Ἀχιλλῆος ποθὴ ἵξεται υἷας Ἀχαιῶν"
  - citation: "1.241"
    sequence: 241
    greek: "σύμπαντας τότε δʼ οὔ τι δυνήσεαι ἀχνύμενός περ"
  - citation: "1.242"
    sequence: 242
    greek: "χραισμεῖν εὖτʼ ἂν πολλοὶ ὑφʼ Ἕκτορος ἀνδροφόνοιο"
  - citation: "1.243"
    sequence: 243
    greek: "θνήσκοντες πίπτωσι σὺ δʼ ἔνδοθι θυμὸν ἀμύξεις"
  - citation: "1.244"
    sequence: 244
    greek: "χωόμενος ὅ τʼ ἄριστον Ἀχαιῶν οὐδὲν ἔτισας"
  - citation: "1.245"
    sequence: 245
    greek: "ὣς φάτο Πηλεΐδης ποτὶ δὲ σκῆπτρον βάλε γαίῃ"
  - citation: "1.246"
    sequence: 246
    greek: "χρυσείοις ἥλοισι πεπαρμένον ἕζετο δʼ αὐτός"
  - citation: "1.247"
    sequence: 247
    greek: "Ἀτρεΐδης δʼ ἑτέρωθεν ἐμήνιε τοῖσι δὲ Νέστωρ"
  - citation: "1.248"
    sequence: 248
    greek: "ἡδυεπὴς ἀνόρουσε λιγὺς Πυλίων ἀγορητής"
  - citation: "1.249"
    sequence: 249
    greek: "τοῦ καὶ ἀπὸ γλώσσης μέλιτος γλυκίων ῥέεν αὐδή"
  - citation: "1.250"
    sequence: 250
    greek: "τῷ δʼ ἤδη δύο μὲν γενεαὶ μερόπων ἀνθρώπων"
  - citation: "1.251"
    sequence: 251
    greek: "ἐφθίαθʼ οἵ οἱ πρόσθεν ἅμα τράφεν ἠδʼ ἐγένοντο"
  - citation: "1.252"
    sequence: 252
    greek: "ἐν Πύλῳ ἠγαθέῃ μετὰ δὲ τριτάτοισιν ἄνασσεν"
  - citation: "1.253"
    sequence: 253
    greek: "ὅ σφιν ἐὺ φρονέων ἀγορήσατο καὶ μετέειπεν"
  - citation: "1.254"
    sequence: 254
    greek: "ὦ πόποι ἦ μέγα πένθος Ἀχαιΐδα γαῖαν ἱκάνει"
  - citation: "1.255"
    sequence: 255
    greek: "ἦ κεν γηθήσαι Πρίαμος Πριάμοιό τε παῖδες"
  - citation: "1.256"
    sequence: 256
    greek: "ἄλλοι τε Τρῶες μέγα κεν κεχαροίατο θυμῷ"
  - citation: "1.257"
    sequence: 257
    greek: "εἰ σφῶϊν τάδε πάντα πυθοίατο μαρναμένοιϊν"
  - citation: "1.258"
    sequence: 258
    greek: "οἳ περὶ μὲν βουλὴν Δαναῶν περὶ δʼ ἐστὲ μάχεσθαι"
  - citation: "1.259"
    sequence: 259
    greek: "ἀλλὰ πίθεσθʼ ἄμφω δὲ νεωτέρω ἐστὸν ἐμεῖο"
  - citation: "1.260"
    sequence: 260
    greek: "ἤδη γάρ ποτʼ ἐγὼ καὶ ἀρείοσιν ἠέ περ ὑμῖν"
  - citation: "1.261"
    sequence: 261
    greek: "ἀνδράσιν ὡμίλησα καὶ οὔ ποτέ μʼ οἵ γʼ ἀθέριζον"
  - citation: "1.262"
    sequence: 262
    greek: "οὐ γάρ πω τοίους ἴδον ἀνέρας οὐδὲ ἴδωμαι"
  - citation: "1.263"
    sequence: 263
    greek: "οἷον Πειρίθοόν τε Δρύαντά τε ποιμένα λαῶν"
  - citation: "1.264"
    sequence: 264
    greek: "Καινέα τʼ Ἐξάδιόν τε καὶ ἀντίθεον Πολύφημον"
  - citation: "1.265"
    sequence: 265
    greek: "Θησέα τʼ Αἰγεΐδην ἐπιείκελον ἀθανάτοισιν"
  - citation: "1.266"
    sequence: 266
    greek: "κάρτιστοι δὴ κεῖνοι ἐπιχθονίων τράφεν ἀνδρῶν"
  - citation: "1.267"
    sequence: 267
    greek: "κάρτιστοι μὲν ἔσαν καὶ καρτίστοις ἐμάχοντο"
  - citation: "1.268"
    sequence: 268
    greek: "φηρσὶν ὀρεσκῴοισι καὶ ἐκπάγλως ἀπόλεσσαν"
  - citation: "1.269"
    sequence: 269
    greek: "καὶ μὲν τοῖσιν ἐγὼ μεθομίλεον ἐκ Πύλου ἐλθὼν"
  - citation: "1.270"
    sequence: 270
    greek: "τηλόθεν ἐξ ἀπίης γαίης καλέσαντο γὰρ αὐτοί"
  - citation: "1.271"
    sequence: 271
    greek: "καὶ μαχόμην κατʼ ἔμʼ αὐτὸν ἐγώ κείνοισι δʼ ἂν οὔ τις"
  - citation: "1.272"
    sequence: 272
    greek: "τῶν οἳ νῦν βροτοί εἰσιν ἐπιχθόνιοι μαχέοιτο"
  - citation: "1.273"
    sequence: 273
    greek: "καὶ μέν μευ βουλέων ξύνιεν πείθοντό τε μύθῳ"
  - citation: "1.274"
    sequence: 274
    greek: "ἀλλὰ πίθεσθε καὶ ὔμμες ἐπεὶ πείθεσθαι ἄμεινον"
  - citation: "1.275"
    sequence: 275
    greek: "μήτε σὺ τόνδʼ ἀγαθός περ ἐὼν ἀποαίρεο κούρην"
  - citation: "1.276"
    sequence: 276
    greek: "ἀλλʼ ἔα ὥς οἱ πρῶτα δόσαν γέρας υἷες Ἀχαιῶν"
  - citation: "1.277"
    sequence: 277
    greek: "μήτε σὺ Πηλείδη ἔθελʼ ἐριζέμεναι βασιλῆϊ"
  - citation: "1.278"
    sequence: 278
    greek: "ἀντιβίην ἐπεὶ οὔ ποθʼ ὁμοίης ἔμμορε τιμῆς"
  - citation: "1.279"
    sequence: 279
    greek: "σκηπτοῦχος βασιλεύς ᾧ τε Ζεὺς κῦδος ἔδωκεν"
  - citation: "1.280"
    sequence: 280
    greek: "εἰ δὲ σὺ καρτερός ἐσσι θεὰ δέ σε γείνατο μήτηρ"
  - citation: "1.281"
    sequence: 281
    greek: "ἀλλʼ ὅ γε φέρτερός ἐστιν ἐπεὶ πλεόνεσσιν ἀνάσσει"
  - citation: "1.282"
    sequence: 282
    greek: "Ἀτρεΐδη σὺ δὲ παῦε τεὸν μένος αὐτὰρ ἔγωγε"
  - citation: "1.283"
    sequence: 283
    greek: "λίσσομʼ Ἀχιλλῆϊ μεθέμεν χόλον ὃς μέγα πᾶσιν"
  - citation: "1.284"
    sequence: 284
    greek: "ἕρκος Ἀχαιοῖσιν πέλεται πολέμοιο κακοῖο"
  - citation: "1.285"
    sequence: 285
    greek: "τὸν δʼ ἀπαμειβόμενος προσέφη κρείων Ἀγαμέμνων"
  - citation: "1.286"
    sequence: 286
    greek: "ναὶ δὴ ταῦτά γε πάντα γέρον κατὰ μοῖραν ἔειπες"
  - citation: "1.287"
    sequence: 287
    greek: "ἀλλʼ ὅδʼ ἀνὴρ ἐθέλει περὶ πάντων ἔμμεναι ἄλλων"
  - citation: "1.288"
    sequence: 288
    greek: "πάντων μὲν κρατέειν ἐθέλει πάντεσσι δʼ ἀνάσσειν"
  - citation: "1.289"
    sequence: 289
    greek: "πᾶσι δὲ σημαίνειν ἅ τινʼ οὐ πείσεσθαι ὀΐω"
  - citation: "1.290"
    sequence: 290
    greek: "εἰ δέ μιν αἰχμητὴν ἔθεσαν θεοὶ αἰὲν ἐόντες"
  - citation: "1.291"
    sequence: 291
    greek: "τοὔνεκά οἱ προθέουσιν ὀνείδεα μυθήσασθαι"
  - citation: "1.292"
    sequence: 292
    greek: "τὸν δʼ ἄρʼ ὑποβλήδην ἠμείβετο δῖος Ἀχιλλεύς"
  - citation: "1.293"
    sequence: 293
    greek: "ἦ γάρ κεν δειλός τε καὶ οὐτιδανὸς καλεοίμην"
  - citation: "1.294"
    sequence: 294
    greek: "εἰ δὴ σοὶ πᾶν ἔργον ὑπείξομαι ὅττί κεν εἴπῃς"
  - citation: "1.295"
    sequence: 295
    greek: "ἄλλοισιν δὴ ταῦτʼ ἐπιτέλλεο μὴ γὰρ ἔμοιγε"
  - citation: "1.296"
    sequence: 296
    greek: "σήμαινʼ οὐ γὰρ ἔγωγʼ ἔτι σοὶ πείσεσθαι ὀΐω"
  - citation: "1.297"
    sequence: 297
    greek: "ἄλλο δέ τοι ἐρέω σὺ δʼ ἐνὶ φρεσὶ βάλλεο σῇσι"
  - citation: "1.298"
    sequence: 298
    greek: "χερσὶ μὲν οὔ τοι ἔγωγε μαχήσομαι εἵνεκα κούρης"
  - citation: "1.299"
    sequence: 299
    greek: "οὔτε σοὶ οὔτέ τῳ ἄλλῳ ἐπεί μʼ ἀφέλεσθέ γε δόντες"
  - citation: "1.300"
    sequence: 300
    greek: "τῶν δʼ ἄλλων ἅ μοί ἐστι θοῇ παρὰ νηῒ μελαίνῃ"
  - citation: "1.301"
    sequence: 301
    greek: "τῶν οὐκ ἄν τι φέροις ἀνελὼν ἀέκοντος ἐμεῖο"
  - citation: "1.302"
    sequence: 302
    greek: "εἰ δʼ ἄγε μὴν πείρησαι ἵνα γνώωσι καὶ οἵδε"
  - citation: "1.303"
    sequence: 303
    greek: "αἶψά τοι αἷμα κελαινὸν ἐρωήσει περὶ δουρί"
  - citation: "1.304"
    sequence: 304
    greek: "ὣς τώ γʼ ἀντιβίοισι μαχεσσαμένω ἐπέεσσιν"
  - citation: "1.305"
    sequence: 305
    greek: "ἀνστήτην λῦσαν δʼ ἀγορὴν παρὰ νηυσὶν Ἀχαιῶν"
  - citation: "1.306"
    sequence: 306
    greek: "Πηλεΐδης μὲν ἐπὶ κλισίας καὶ νῆας ἐΐσας"
  - citation: "1.307"
    sequence: 307
    greek: "ἤϊε σύν τε Μενοιτιάδῃ καὶ οἷς ἑτάροισιν"
  - citation: "1.308"
    sequence: 308
    greek: "Ἀτρεΐδης δʼ ἄρα νῆα θοὴν ἅλα δὲ προέρυσσεν"
  - citation: "1.309"
    sequence: 309
    greek: "ἐν δʼ ἐρέτας ἔκρινεν ἐείκοσιν ἐς δʼ ἑκατόμβην"
  - citation: "1.310"
    sequence: 310
    greek: "βῆσε θεῷ ἀνὰ δὲ Χρυσηΐδα καλλιπάρῃον"
  - citation: "1.311"
    sequence: 311
    greek: "εἷσεν ἄγων ἐν δʼ ἀρχὸς ἔβη πολύμητις Ὀδυσσεύς"
  - citation: "1.312"
    sequence: 312
    greek: "οἳ μὲν ἔπειτʼ ἀναβάντες ἐπέπλεον ὑγρὰ κέλευθα"
  - citation: "1.313"
    sequence: 313
    greek: "λαοὺς δʼ Ἀτρεΐδης ἀπολυμαίνεσθαι ἄνωγεν"
  - citation: "1.314"
    sequence: 314
    greek: "οἳ δʼ ἀπελυμαίνοντο καὶ εἰς ἅλα λύματα βάλλον"
  - citation: "1.315"
    sequence: 315
    greek: "ἕρδον δʼ Ἀπόλλωνι τεληέσσας ἑκατόμβας"
  - citation: "1.316"
    sequence: 316
    greek: "ταύρων ἠδʼ αἰγῶν παρὰ θῖνʼ ἁλὸς ἀτρυγέτοιο"
  - citation: "1.317"
    sequence: 317
    greek: "κνίση δʼ οὐρανὸν ἷκεν ἑλισσομένη περὶ καπνῷ"
  - citation: "1.318"
    sequence: 318
    greek: "ὣς οἳ μὲν τὰ πένοντο κατὰ στρατόν οὐδʼ Ἀγαμέμνων"
  - citation: "1.319"
    sequence: 319
    greek: "λῆγʼ ἔριδος τὴν πρῶτον ἐπηπείλησʼ Ἀχιλῆϊ"
  - citation: "1.320"
    sequence: 320
    greek: "ἀλλʼ ὅ γε Ταλθύβιόν τε καὶ Εὐρυβάτην προσέειπε"
  - citation: "1.321"
    sequence: 321
    greek: "τώ οἱ ἔσαν κήρυκε καὶ ὀτρηρὼ θεράποντε"
  - citation: "1.322"
    sequence: 322
    greek: "ἔρχεσθον κλισίην Πηληϊάδεω Ἀχιλῆος"
  - citation: "1.323"
    sequence: 323
    greek: "χειρὸς ἑλόντʼ ἀγέμεν Βρισηΐδα καλλιπάρῃον"
  - citation: "1.324"
    sequence: 324
    greek: "εἰ δέ κε μὴ δώῃσιν ἐγὼ δέ κεν αὐτὸς ἕλωμαι"
  - citation: "1.325"
    sequence: 325
    greek: "ἐλθὼν σὺν πλεόνεσσι τό οἱ καὶ ῥίγιον ἔσται"
  - citation: "1.326"
    sequence: 326
    greek: "ὣς εἰπὼν προΐει κρατερὸν δʼ ἐπὶ μῦθον ἔτελλε"
  - citation: "1.327"
    sequence: 327
    greek: "τὼ δʼ ἀέκοντε βάτην παρὰ θῖνʼ ἁλὸς ἀτρυγέτοιο"
  - citation: "1.328"
    sequence: 328
    greek: "Μυρμιδόνων δʼ ἐπί τε κλισίας καὶ νῆας ἱκέσθην"
  - citation: "1.329"
    sequence: 329
    greek: "τὸν δʼ εὗρον παρά τε κλισίῃ καὶ νηῒ μελαίνῃ"
  - citation: "1.330"
    sequence: 330
    greek: "ἥμενον οὐδʼ ἄρα τώ γε ἰδὼν γήθησεν Ἀχιλλεύς"
  - citation: "1.331"
    sequence: 331
    greek: "τὼ μὲν ταρβήσαντε καὶ αἰδομένω βασιλῆα"
  - citation: "1.332"
    sequence: 332
    greek: "στήτην οὐδέ τί μιν προσεφώνεον οὐδʼ ἐρέοντο"
  - citation: "1.333"
    sequence: 333
    greek: "αὐτὰρ ὃ ἔγνω ᾗσιν ἐνὶ φρεσὶ φώνησέν τε"
  - citation: "1.334"
    sequence: 334
    greek: "χαίρετε κήρυκες Διὸς ἄγγελοι ἠδὲ καὶ ἀνδρῶν"
  - citation: "1.335"
    sequence: 335
    greek: "ἆσσον ἴτʼ οὔ τί μοι ὔμμες ἐπαίτιοι ἀλλʼ Ἀγαμέμνων"
  - citation: "1.336"
    sequence: 336
    greek: "ὃ σφῶϊ προΐει Βρισηΐδος εἵνεκα κούρης"
  - citation: "1.337"
    sequence: 337
    greek: "ἀλλʼ ἄγε διογενὲς Πατρόκλεες ἔξαγε κούρην"
  - citation: "1.338"
    sequence: 338
    greek: "καί σφωϊν δὸς ἄγειν τὼ δʼ αὐτὼ μάρτυροι ἔστων"
  - citation: "1.339"
    sequence: 339
    greek: "πρός τε θεῶν μακάρων πρός τε θνητῶν ἀνθρώπων"
  - citation: "1.340"
    sequence: 340
    greek: "καὶ πρὸς τοῦ βασιλῆος ἀπηνέος εἴ ποτε δʼ αὖτε"
  - citation: "1.341"
    sequence: 341
    greek: "χρειὼ ἐμεῖο γένηται ἀεικέα λοιγὸν ἀμῦναι"
  - citation: "1.342"
    sequence: 342
    greek: "τοῖς ἄλλοις ἦ γὰρ ὅ γʼ ὀλοιῇσι φρεσὶ θύει"
  - citation: "1.343"
    sequence: 343
    greek: "οὐδέ τι οἶδε νοῆσαι ἅμα πρόσσω καὶ ὀπίσσω"
  - citation: "1.344"
    sequence: 344
    greek: "ὅππως οἱ παρὰ νηυσὶ σόοι μαχέοιντο Ἀχαιοί"
  - citation: "1.345"
    sequence: 345
    greek: "ὣς φάτο Πάτροκλος δὲ φίλῳ ἐπεπείθεθʼ ἑταίρῳ"
  - citation: "1.346"
    sequence: 346
    greek: "ἐκ δʼ ἄγαγε κλισίης Βρισηΐδα καλλιπάρῃον"
  - citation: "1.347"
    sequence: 347
    greek: "δῶκε δʼ ἄγειν τὼ δʼ αὖτις ἴτην παρὰ νῆας Ἀχαιῶν"
  - citation: "1.348"
    sequence: 348
    greek: "ἣ δʼ ἀέκουσʼ ἅμα τοῖσι γυνὴ κίεν αὐτὰρ Ἀχιλλεὺς"
  - citation: "1.349"
    sequence: 349
    greek: "δακρύσας ἑτάρων ἄφαρ ἕζετο νόσφι λιασθείς"
  - citation: "1.350"
    sequence: 350
    greek: "θῖνʼ ἔφʼ ἁλὸς πολιῆς ὁρόων ἐπʼ ἀπείρονα πόντον"
  - citation: "1.351"
    sequence: 351
    greek: "πολλὰ δὲ μητρὶ φίλῃ ἠρήσατο χεῖρας ὀρεγνύς"
  - citation: "1.352"
    sequence: 352
    greek: "μῆτερ ἐπεί μʼ ἔτεκές γε μινυνθάδιόν περ ἐόντα"
  - citation: "1.353"
    sequence: 353
    greek: "τιμήν πέρ μοι ὄφελλεν Ὀλύμπιος ἐγγυαλίξαι"
  - citation: "1.354"
    sequence: 354
    greek: "Ζεὺς ὑψιβρεμέτης νῦν δʼ οὐδέ με τυτθὸν ἔτισεν"
  - citation: "1.355"
    sequence: 355
    greek: "ἦ γάρ μʼ Ἀτρεΐδης εὐρὺ κρείων Ἀγαμέμνων"
  - citation: "1.356"
    sequence: 356
    greek: "ἠτίμησεν ἑλὼν γὰρ ἔχει γέρας αὐτὸς ἀπούρας"
  - citation: "1.357"
    sequence: 357
    greek: "ὣς φάτο δάκρυ χέων τοῦ δʼ ἔκλυε πότνια μήτηρ"
  - citation: "1.358"
    sequence: 358
    greek: "ἡμένη ἐν βένθεσσιν ἁλὸς παρὰ πατρὶ γέροντι"
  - citation: "1.359"
    sequence: 359
    greek: "καρπαλίμως δʼ ἀνέδυ πολιῆς ἁλὸς ἠΰτʼ ὀμίχλη"
  - citation: "1.360"
    sequence: 360
    greek: "καί ῥα πάροιθʼ αὐτοῖο καθέζετο δάκρυ χέοντος"
  - citation: "1.361"
    sequence: 361
    greek: "χειρί τέ μιν κατέρεξεν ἔπος τʼ ἔφατʼ ἔκ τʼ ὀνόμαζε"
  - citation: "1.362"
    sequence: 362
    greek: "τέκνον τί κλαίεις τί δέ σε φρένας ἵκετο πένθος"
  - citation: "1.363"
    sequence: 363
    greek: "ἐξαύδα μὴ κεῦθε νόῳ ἵνα εἴδομεν ἄμφω"
  - citation: "1.364"
    sequence: 364
    greek: "τὴν δὲ βαρὺ στενάχων προσέφη πόδας ὠκὺς Ἀχιλλεύς"
  - citation: "1.365"
    sequence: 365
    greek: "οἶσθα τί ἤ τοι ταῦτα ἰδυίῃ πάντʼ ἀγορεύω"
  - citation: "1.366"
    sequence: 366
    greek: "ᾠχόμεθʼ ἐς Θήβην ἱερὴν πόλιν Ἠετίωνος"
  - citation: "1.367"
    sequence: 367
    greek: "τὴν δὲ διεπράθομέν τε καὶ ἤγομεν ἐνθάδε πάντα"
  - citation: "1.368"
    sequence: 368
    greek: "καὶ τὰ μὲν εὖ δάσσαντο μετὰ σφίσιν υἷες Ἀχαιῶν"
  - citation: "1.369"
    sequence: 369
    greek: "ἐκ δʼ ἕλον Ἀτρεΐδῃ Χρυσηΐδα καλλιπάρῃον"
  - citation: "1.370"
    sequence: 370
    greek: "Χρύσης δʼ αὖθʼ ἱερεὺς ἑκατηβόλου Ἀπόλλωνος"
  - citation: "1.371"
    sequence: 371
    greek: "ἦλθε θοὰς ἐπὶ νῆας Ἀχαιῶν χαλκοχιτώνων"
  - citation: "1.372"
    sequence: 372
    greek: "λυσόμενός τε θύγατρα φέρων τʼ ἀπερείσιʼ ἄποινα"
  - citation: "1.373"
    sequence: 373
    greek: "στέμματʼ ἔχων ἐν χερσὶν ἑκηβόλου Ἀπόλλωνος"
  - citation: "1.374"
    sequence: 374
    greek: "χρυσέῳ ἀνὰ σκήπτρῳ καὶ λίσσετο πάντας Ἀχαιούς"
  - citation: "1.375"
    sequence: 375
    greek: "Ἀτρεΐδα δὲ μάλιστα δύω κοσμήτορε λαῶν"
  - citation: "1.376"
    sequence: 376
    greek: "ἔνθʼ ἄλλοι μὲν πάντες ἐπευφήμησαν Ἀχαιοὶ"
  - citation: "1.377"
    sequence: 377
    greek: "αἰδεῖσθαί θʼ ἱερῆα καὶ ἀγλαὰ δέχθαι ἄποινα"
  - citation: "1.378"
    sequence: 378
    greek: "ἀλλʼ οὐκ Ἀτρεΐδῃ Ἀγαμέμνονι ἥνδανε θυμῷ"
  - citation: "1.379"
    sequence: 379
    greek: "ἀλλὰ κακῶς ἀφίει κρατερὸν δʼ ἐπὶ μῦθον ἔτελλε"
  - citation: "1.380"
    sequence: 380
    greek: "χωόμενος δʼ ὁ γέρων πάλιν ᾤχετο τοῖο δʼ Ἀπόλλων"
  - citation: "1.381"
    sequence: 381
    greek: "εὐξαμένου ἤκουσεν ἐπεὶ μάλα οἱ φίλος ἦεν"
  - citation: "1.382"
    sequence: 382
    greek: "ἧκε δʼ ἐπʼ Ἀργείοισι κακὸν βέλος οἳ δέ νυ λαοὶ"
  - citation: "1.383"
    sequence: 383
    greek: "θνῇσκον ἐπασσύτεροι τὰ δʼ ἐπῴχετο κῆλα θεοῖο"
  - citation: "1.384"
    sequence: 384
    greek: "πάντῃ ἀνὰ στρατὸν εὐρὺν Ἀχαιῶν ἄμμι δὲ μάντις"
  - citation: "1.385"
    sequence: 385
    greek: "εὖ εἰδὼς ἀγόρευε θεοπροπίας ἑκάτοιο"
  - citation: "1.386"
    sequence: 386
    greek: "αὐτίκʼ ἐγὼ πρῶτος κελόμην θεὸν ἱλάσκεσθαι"
  - citation: "1.387"
    sequence: 387
    greek: "Ἀτρεΐωνα δʼ ἔπειτα χόλος λάβεν αἶψα δʼ ἀναστὰς"
  - citation: "1.388"
    sequence: 388
    greek: "ἠπείλησεν μῦθον ὃ δὴ τετελεσμένος ἐστί"
  - citation: "1.389"
    sequence: 389
    greek: "τὴν μὲν γὰρ σὺν νηῒ θοῇ ἑλίκωπες Ἀχαιοὶ"
  - citation: "1.390"
    sequence: 390
    greek: "ἐς Χρύσην πέμπουσιν ἄγουσι δὲ δῶρα ἄνακτι"
  - citation: "1.391"
    sequence: 391
    greek: "τὴν δὲ νέον κλισίηθεν ἔβαν κήρυκες ἄγοντες"
  - citation: "1.392"
    sequence: 392
    greek: "κούρην Βρισῆος τήν μοι δόσαν υἷες Ἀχαιῶν"
  - citation: "1.393"
    sequence: 393
    greek: "ἀλλὰ σὺ εἰ δύνασαί γε περίσχεο παιδὸς ἑῆος"
  - citation: "1.394"
    sequence: 394
    greek: "ἐλθοῦσʼ Οὔλυμπον δὲ Δία λίσαι εἴ ποτε δή τι"
  - citation: "1.395"
    sequence: 395
    greek: "ἢ ἔπει ὤνησας κραδίην Διὸς ἠὲ καὶ ἔργῳ"
  - citation: "1.396"
    sequence: 396
    greek: "πολλάκι γάρ σεο πατρὸς ἐνὶ μεγάροισιν ἄκουσα"
  - citation: "1.397"
    sequence: 397
    greek: "εὐχομένης ὅτʼ ἔφησθα κελαινεφέϊ Κρονίωνι"
  - citation: "1.398"
    sequence: 398
    greek: "οἴη ἐν ἀθανάτοισιν ἀεικέα λοιγὸν ἀμῦναι"
  - citation: "1.399"
    sequence: 399
    greek: "ὁππότε μιν ξυνδῆσαι Ὀλύμπιοι ἤθελον ἄλλοι"
  - citation: "1.400"
    sequence: 400
    greek: "Ἥρη τʼ ἠδὲ Ποσειδάων καὶ Παλλὰς Ἀθήνη"
  - citation: "1.401"
    sequence: 401
    greek: "ἀλλὰ σὺ τόν γʼ ἐλθοῦσα θεὰ ὑπελύσαο δεσμῶν"
  - citation: "1.402"
    sequence: 402
    greek: "ὦχʼ ἑκατόγχειρον καλέσασʼ ἐς μακρὸν Ὄλυμπον"
  - citation: "1.403"
    sequence: 403
    greek: "ὃν Βριάρεων καλέουσι θεοί ἄνδρες δέ τε πάντες"
  - citation: "1.404"
    sequence: 404
    greek: "Αἰγαίωνʼ ὃ γὰρ αὖτε βίην οὗ πατρὸς ἀμείνων"
  - citation: "1.405"
    sequence: 405
    greek: "ὅς ῥα παρὰ Κρονίωνι καθέζετο κύδεϊ γαίων"
  - citation: "1.406"
    sequence: 406
    greek: "τὸν καὶ ὑπέδεισαν μάκαρες θεοὶ οὐδʼ ἔτʼ ἔδησαν"
  - citation: "1.407"
    sequence: 407
    greek: "τῶν νῦν μιν μνήσασα παρέζεο καὶ λαβὲ γούνων"
  - citation: "1.408"
    sequence: 408
    greek: "αἴ κέν πως ἐθέλῃσιν ἐπὶ Τρώεσσιν ἀρῆξαι"
  - citation: "1.409"
    sequence: 409
    greek: "τοὺς δὲ κατὰ πρύμνας τε καὶ ἀμφʼ ἅλα ἔλσαι Ἀχαιοὺς"
  - citation: "1.410"
    sequence: 410
    greek: "κτεινομένους ἵνα πάντες ἐπαύρωνται βασιλῆος"
  - citation: "1.411"
    sequence: 411
    greek: "γνῷ δὲ καὶ Ἀτρεΐδης εὐρὺ κρείων Ἀγαμέμνων"
  - citation: "1.412"
    sequence: 412
    greek: "ἣν ἄτην ὅ τʼ ἄριστον Ἀχαιῶν οὐδὲν ἔτισεν"
  - citation: "1.413"
    sequence: 413
    greek: "τὸν δʼ ἠμείβετʼ ἔπειτα Θέτις κατὰ δάκρυ χέουσα"
  - citation: "1.414"
    sequence: 414
    greek: "ὤ μοι τέκνον ἐμόν τί νύ σʼ ἔτρεφον αἰνὰ τεκοῦσα"
  - citation: "1.415"
    sequence: 415
    greek: "αἴθʼ ὄφελες παρὰ νηυσὶν ἀδάκρυτος καὶ ἀπήμων"
  - citation: "1.416"
    sequence: 416
    greek: "ἧσθαι ἐπεί νύ τοι αἶσα μίνυνθά περ οὔ τι μάλα δήν"
  - citation: "1.417"
    sequence: 417
    greek: "νῦν δʼ ἅμα τʼ ὠκύμορος καὶ ὀϊζυρὸς περὶ πάντων"
  - citation: "1.418"
    sequence: 418
    greek: "ἔπλεο τώ σε κακῇ αἴσῃ τέκον ἐν μεγάροισι"
  - citation: "1.419"
    sequence: 419
    greek: "τοῦτο δέ τοι ἐρέουσα ἔπος Διὶ τερπικεραύνῳ"
  - citation: "1.420"
    sequence: 420
    greek: "εἶμʼ αὐτὴ πρὸς Ὄλυμπον ἀγάννιφον αἴ κε πίθηται"
  - citation: "1.421"
    sequence: 421
    greek: "ἀλλὰ σὺ μὲν νῦν νηυσὶ παρήμενος ὠκυπόροισι"
  - citation: "1.422"
    sequence: 422
    greek: "μήνιʼ Ἀχαιοῖσιν πολέμου δʼ ἀποπαύεο πάμπαν"
  - citation: "1.423"
    sequence: 423
    greek: "Ζεὺς γὰρ ἐς Ὠκεανὸν μετʼ ἀμύμονας Αἰθιοπῆας"
  - citation: "1.424"
    sequence: 424
    greek: "χθιζὸς ἔβη κατὰ δαῖτα θεοὶ δʼ ἅμα πάντες ἕποντο"
  - citation: "1.425"
    sequence: 425
    greek: "δωδεκάτῃ δέ τοι αὖτις ἐλεύσεται Οὔλυμπον δέ"
  - citation: "1.426"
    sequence: 426
    greek: "καὶ τότʼ ἔπειτά τοι εἶμι Διὸς ποτὶ χαλκοβατὲς δῶ"
  - citation: "1.427"
    sequence: 427
    greek: "καί μιν γουνάσομαι καί μιν πείσεσθαι ὀΐω"
  - citation: "1.428"
    sequence: 428
    greek: "ὣς ἄρα φωνήσασʼ ἀπεβήσετο τὸν δὲ λίπʼ αὐτοῦ"
  - citation: "1.429"
    sequence: 429
    greek: "χωόμενον κατὰ θυμὸν ἐϋζώνοιο γυναικὸς"
  - citation: "1.430"
    sequence: 430
    greek: "τήν ῥα βίῃ ἀέκοντος ἀπηύρων αὐτὰρ Ὀδυσσεὺς"
  - citation: "1.431"
    sequence: 431
    greek: "ἐς Χρύσην ἵκανεν ἄγων ἱερὴν ἑκατόμβην"
  - citation: "1.432"
    sequence: 432
    greek: "οἳ δʼ ὅτε δὴ λιμένος πολυβενθέος ἐντὸς ἵκοντο"
  - citation: "1.433"
    sequence: 433
    greek: "ἱστία μὲν στείλαντο θέσαν δʼ ἐν νηῒ μελαίνῃ"
  - citation: "1.434"
    sequence: 434
    greek: "ἱστὸν δʼ ἱστοδόκῃ πέλασαν προτόνοισιν ὑφέντες"
  - citation: "1.435"
    sequence: 435
    greek: "καρπαλίμως τὴν δʼ εἰς ὅρμον προέρεσσαν ἐρετμοῖς"
  - citation: "1.436"
    sequence: 436
    greek: "ἐκ δʼ εὐνὰς ἔβαλον κατὰ δὲ πρυμνήσιʼ ἔδησαν"
  - citation: "1.437"
    sequence: 437
    greek: "ἐκ δὲ καὶ αὐτοὶ βαῖνον ἐπὶ ῥηγμῖνι θαλάσσης"
  - citation: "1.438"
    sequence: 438
    greek: "ἐκ δʼ ἑκατόμβην βῆσαν ἑκηβόλῳ Ἀπόλλωνι"
  - citation: "1.439"
    sequence: 439
    greek: "ἐκ δὲ Χρυσηῒς νηὸς βῆ ποντοπόροιο"
  - citation: "1.440"
    sequence: 440
    greek: "τὴν μὲν ἔπειτʼ ἐπὶ βωμὸν ἄγων πολύμητις Ὀδυσσεὺς"
  - citation: "1.441"
    sequence: 441
    greek: "πατρὶ φίλῳ ἐν χερσὶ τίθει καί μιν προσέειπεν"
  - citation: "1.442"
    sequence: 442
    greek: "ὦ Χρύση πρό μʼ ἔπεμψεν ἄναξ ἀνδρῶν Ἀγαμέμνων"
  - citation: "1.443"
    sequence: 443
    greek: "παῖδά τε σοὶ ἀγέμεν Φοίβῳ θʼ ἱερὴν ἑκατόμβην"
  - citation: "1.444"
    sequence: 444
    greek: "ῥέξαι ὑπὲρ Δαναῶν ὄφρʼ ἱλασόμεσθα ἄνακτα"
  - citation: "1.445"
    sequence: 445
    greek: "ὃς νῦν Ἀργείοισι πολύστονα κήδεʼ ἐφῆκεν"
  - citation: "1.446"
    sequence: 446
    greek: "ὣς εἰπὼν ἐν χερσὶ τίθει ὃ δὲ δέξατο χαίρων"
  - citation: "1.447"
    sequence: 447
    greek: "παῖδα φίλην τοὶ δʼ ὦκα θεῷ ἱερὴν ἑκατόμβην"
  - citation: "1.448"
    sequence: 448
    greek: "ἑξείης ἔστησαν ἐΰδμητον περὶ βωμόν"
  - citation: "1.449"
    sequence: 449
    greek: "χερνίψαντο δʼ ἔπειτα καὶ οὐλοχύτας ἀνέλοντο"
  - citation: "1.450"
    sequence: 450
    greek: "τοῖσιν δὲ Χρύσης μεγάλʼ εὔχετο χεῖρας ἀνασχών"
  - citation: "1.451"
    sequence: 451
    greek: "κλῦθί μευ ἀργυρότοξʼ ὃς Χρύσην ἀμφιβέβηκας"
  - citation: "1.452"
    sequence: 452
    greek: "Κίλλαν τε ζαθέην Τενέδοιό τε ἶφι ἀνάσσεις"
  - citation: "1.453"
    sequence: 453
    greek: "ἦ μὲν δή ποτʼ ἐμεῦ πάρος ἔκλυες εὐξαμένοιο"
  - citation: "1.454"
    sequence: 454
    greek: "τίμησας μὲν ἐμέ μέγα δʼ ἴψαο λαὸν Ἀχαιῶν"
  - citation: "1.455"
    sequence: 455
    greek: "ἠδʼ ἔτι καὶ νῦν μοι τόδʼ ἐπικρήηνον ἐέλδωρ"
  - citation: "1.456"
    sequence: 456
    greek: "ἤδη νῦν Δαναοῖσιν ἀεικέα λοιγὸν ἄμυνον"
  - citation: "1.457"
    sequence: 457
    greek: "ὣς ἔφατʼ εὐχόμενος τοῦ δʼ ἔκλυε Φοῖβος Ἀπόλλων"
  - citation: "1.458"
    sequence: 458
    greek: "αὐτὰρ ἐπεί ῥʼ εὔξαντο καὶ οὐλοχύτας προβάλοντο"
  - citation: "1.459"
    sequence: 459
    greek: "αὐέρυσαν μὲν πρῶτα καὶ ἔσφαξαν καὶ ἔδειραν"
  - citation: "1.460"
    sequence: 460
    greek: "μηρούς τʼ ἐξέταμον κατά τε κνίσῃ ἐκάλυψαν"
  - citation: "1.461"
    sequence: 461
    greek: "δίπτυχα ποιήσαντες ἐπʼ αὐτῶν δʼ ὠμοθέτησαν"
  - citation: "1.462"
    sequence: 462
    greek: "καῖε δʼ ἐπὶ σχίζῃς ὁ γέρων ἐπὶ δʼ αἴθοπα οἶνον"
  - citation: "1.463"
    sequence: 463
    greek: "λεῖβε νέοι δὲ παρʼ αὐτὸν ἔχον πεμπώβολα χερσίν"
  - citation: "1.464"
    sequence: 464
    greek: "αὐτὰρ ἐπεὶ κατὰ μῆρε κάη καὶ σπλάγχνα πάσαντο"
  - citation: "1.465"
    sequence: 465
    greek: "μίστυλλόν τʼ ἄρα τἆλλα καὶ ἀμφʼ ὀβελοῖσιν ἔπειραν"
  - citation: "1.466"
    sequence: 466
    greek: "ὤπτησάν τε περιφραδέως ἐρύσαντό τε πάντα"
  - citation: "1.467"
    sequence: 467
    greek: "αὐτὰρ ἐπεὶ παύσαντο πόνου τετύκοντό τε δαῖτα"
  - citation: "1.468"
    sequence: 468
    greek: "δαίνυντʼ οὐδέ τι θυμὸς ἐδεύετο δαιτὸς ἐΐσης"
  - citation: "1.469"
    sequence: 469
    greek: "αὐτὰρ ἐπεὶ πόσιος καὶ ἐδητύος ἐξ ἔρον ἕντο"
  - citation: "1.470"
    sequence: 470
    greek: "κοῦροι μὲν κρητῆρας ἐπεστέψαντο ποτοῖο"
  - citation: "1.471"
    sequence: 471
    greek: "νώμησαν δʼ ἄρα πᾶσιν ἐπαρξάμενοι δεπάεσσιν"
  - citation: "1.472"
    sequence: 472
    greek: "οἳ δὲ πανημέριοι μολπῇ θεὸν ἱλάσκοντο"
  - citation: "1.473"
    sequence: 473
    greek: "καλὸν ἀείδοντες παιήονα κοῦροι Ἀχαιῶν"
  - citation: "1.474"
    sequence: 474
    greek: "μέλποντες ἑκάεργον ὃ δὲ φρένα τέρπετʼ ἀκούων"
  - citation: "1.475"
    sequence: 475
    greek: "ἦμος δʼ ἠέλιος κατέδυ καὶ ἐπὶ κνέφας ἦλθε"
  - citation: "1.476"
    sequence: 476
    greek: "δὴ τότε κοιμήσαντο παρὰ πρυμνήσια νηός"
  - citation: "1.477"
    sequence: 477
    greek: "ἦμος δʼ ἠριγένεια φάνη ῥοδοδάκτυλος Ἠώς"
  - citation: "1.478"
    sequence: 478
    greek: "καὶ τότʼ ἔπειτʼ ἀνάγοντο μετὰ στρατὸν εὐρὺν Ἀχαιῶν"
  - citation: "1.479"
    sequence: 479
    greek: "τοῖσιν δʼ ἴκμενον οὖρον ἵει ἑκάεργος Ἀπόλλων"
  - citation: "1.480"
    sequence: 480
    greek: "οἳ δʼ ἱστὸν στήσαντʼ ἀνά θʼ ἱστία λευκὰ πέτασσαν"
  - citation: "1.481"
    sequence: 481
    greek: "ἐν δʼ ἄνεμος πρῆσεν μέσον ἱστίον ἀμφὶ δὲ κῦμα"
  - citation: "1.482"
    sequence: 482
    greek: "στείρῃ πορφύρεον μεγάλʼ ἴαχε νηὸς ἰούσης"
  - citation: "1.483"
    sequence: 483
    greek: "ἣ δʼ ἔθεεν κατὰ κῦμα διαπρήσσουσα κέλευθον"
  - citation: "1.484"
    sequence: 484
    greek: "αὐτὰρ ἐπεί ῥʼ ἵκοντο κατὰ στρατὸν εὐρὺν Ἀχαιῶν"
  - citation: "1.485"
    sequence: 485
    greek: "νῆα μὲν οἵ γε μέλαιναν ἐπʼ ἠπείροιο ἔρυσσαν"
  - citation: "1.486"
    sequence: 486
    greek: "ὑψοῦ ἐπὶ ψαμάθοις ὑπὸ δʼ ἕρματα μακρὰ τάνυσσαν"
  - citation: "1.487"
    sequence: 487
    greek: "αὐτοὶ δʼ ἐσκίδναντο κατὰ κλισίας τε νέας τε"
  - citation: "1.488"
    sequence: 488
    greek: "αὐτὰρ ὃ μήνιε νηυσὶ παρήμενος ὠκυπόροισι"
  - citation: "1.489"
    sequence: 489
    greek: "διογενὴς Πηλῆος υἱὸς πόδας ὠκὺς Ἀχιλλεύς"
  - citation: "1.490"
    sequence: 490
    greek: "οὔτέ ποτʼ εἰς ἀγορὴν πωλέσκετο κυδιάνειραν"
  - citation: "1.491"
    sequence: 491
    greek: "οὔτέ ποτʼ ἐς πόλεμον ἀλλὰ φθινύθεσκε φίλον κῆρ"
  - citation: "1.492"
    sequence: 492
    greek: "αὖθι μένων ποθέεσκε δʼ ἀϋτήν τε πτόλεμόν τε"
  - citation: "1.493"
    sequence: 493
    greek: "ἀλλʼ ὅτε δή ῥʼ ἐκ τοῖο δυωδεκάτη γένετʼ ἠώς"
  - citation: "1.494"
    sequence: 494
    greek: "καὶ τότε δὴ πρὸς Ὄλυμπον ἴσαν θεοὶ αἰὲν ἐόντες"
  - citation: "1.495"
    sequence: 495
    greek: "πάντες ἅμα Ζεὺς δʼ ἦρχε Θέτις δʼ οὐ λήθετʼ ἐφετμέων"
  - citation: "1.496"
    sequence: 496
    greek: "παιδὸς ἑοῦ ἀλλʼ ἥ γʼ ἀνεδύσετο κῦμα θαλάσσης"
  - citation: "1.497"
    sequence: 497
    greek: "ἠερίη δʼ ἀνέβη μέγαν οὐρανὸν Οὔλυμπόν τε"
  - citation: "1.498"
    sequence: 498
    greek: "εὗρεν δʼ εὐρύοπα Κρονίδην ἄτερ ἥμενον ἄλλων"
  - citation: "1.499"
    sequence: 499
    greek: "ἀκροτάτῃ κορυφῇ πολυδειράδος Οὐλύμποιο"
  - citation: "1.500"
    sequence: 500
    greek: "καί ῥα πάροιθʼ αὐτοῖο καθέζετο καὶ λάβε γούνων"
  - citation: "1.501"
    sequence: 501
    greek: "σκαιῇ δεξιτερῇ δʼ ἄρʼ ὑπʼ ἀνθερεῶνος ἑλοῦσα"
  - citation: "1.502"
    sequence: 502
    greek: "λισσομένη προσέειπε Δία Κρονίωνα ἄνακτα"
  - citation: "1.503"
    sequence: 503
    greek: "Ζεῦ πάτερ εἴ ποτε δή σε μετʼ ἀθανάτοισιν ὄνησα"
  - citation: "1.504"
    sequence: 504
    greek: "ἢ ἔπει ἢ ἔργῳ τόδε μοι κρήηνον ἐέλδωρ"
  - citation: "1.505"
    sequence: 505
    greek: "τίμησόν μοι υἱὸν ὃς ὠκυμορώτατος ἄλλων"
  - citation: "1.506"
    sequence: 506
    greek: "ἔπλετʼ ἀτάρ μιν νῦν γε ἄναξ ἀνδρῶν Ἀγαμέμνων"
  - citation: "1.507"
    sequence: 507
    greek: "ἠτίμησεν ἑλὼν γὰρ ἔχει γέρας αὐτὸς ἀπούρας"
  - citation: "1.508"
    sequence: 508
    greek: "ἀλλὰ σύ πέρ μιν τῖσον Ὀλύμπιε μητίετα Ζεῦ"
  - citation: "1.509"
    sequence: 509
    greek: "τόφρα δʼ ἐπὶ Τρώεσσι τίθει κράτος ὄφρʼ ἂν Ἀχαιοὶ"
  - citation: "1.510"
    sequence: 510
    greek: "υἱὸν ἐμὸν τίσωσιν ὀφέλλωσίν τέ ἑ τιμῇ"
  - citation: "1.511"
    sequence: 511
    greek: "ὣς φάτο τὴν δʼ οὔ τι προσέφη νεφεληγερέτα Ζεύς"
  - citation: "1.512"
    sequence: 512
    greek: "ἀλλʼ ἀκέων δὴν ἧστο Θέτις δʼ ὡς ἥψατο γούνων"
  - citation: "1.513"
    sequence: 513
    greek: "ὣς ἔχετʼ ἐμπεφυυῖα καὶ εἴρετο δεύτερον αὖτις"
  - citation: "1.514"
    sequence: 514
    greek: "νημερτὲς μὲν δή μοι ὑπόσχεο καὶ κατάνευσον"
  - citation: "1.515"
    sequence: 515
    greek: "ἢ ἀπόειπʼ ἐπεὶ οὔ τοι ἔπι δέος ὄφρʼ ἐῢ εἰδέω"
  - citation: "1.516"
    sequence: 516
    greek: "ὅσσον ἐγὼ μετὰ πᾶσιν ἀτιμοτάτη θεός εἰμι"
  - citation: "1.517"
    sequence: 517
    greek: "τὴν δὲ μέγʼ ὀχθήσας προσέφη νεφεληγερέτα Ζεύς"
  - citation: "1.518"
    sequence: 518
    greek: "ἦ δὴ λοίγια ἔργʼ ὅ τέ μʼ ἐχθοδοπῆσαι ἐφήσεις"
  - citation: "1.519"
    sequence: 519
    greek: "Ἥρῃ ὅτʼ ἄν μʼ ἐρέθῃσιν ὀνειδείοις ἐπέεσσιν"
  - citation: "1.520"
    sequence: 520
    greek: "ἣ δὲ καὶ αὔτως μʼ αἰεὶ ἐν ἀθανάτοισι θεοῖσι"
  - citation: "1.521"
    sequence: 521
    greek: "νεικεῖ καί τέ μέ φησι μάχῃ Τρώεσσιν ἀρήγειν"
  - citation: "1.522"
    sequence: 522
    greek: "ἀλλὰ σὺ μὲν νῦν αὖτις ἀπόστιχε μή τι νοήσῃ"
  - citation: "1.523"
    sequence: 523
    greek: "Ἥρη ἐμοὶ δέ κε ταῦτα μελήσεται ὄφρα τελέσσω"
  - citation: "1.524"
    sequence: 524
    greek: "εἰ δʼ ἄγε τοι κεφαλῇ κατανεύσομαι ὄφρα πεποίθῃς"
  - citation: "1.525"
    sequence: 525
    greek: "τοῦτο γὰρ ἐξ ἐμέθεν γε μετʼ ἀθανάτοισι μέγιστον"
  - citation: "1.526"
    sequence: 526
    greek: "τέκμωρ οὐ γὰρ ἐμὸν παλινάγρετον οὐδʼ ἀπατηλὸν"
  - citation: "1.527"
    sequence: 527
    greek: "οὐδʼ ἀτελεύτητον ὅ τί κεν κεφαλῇ κατανεύσω"
  - citation: "1.528"
    sequence: 528
    greek: "ἦ καὶ κυανέῃσιν ἐπʼ ὀφρύσι νεῦσε Κρονίων"
  - citation: "1.529"
    sequence: 529
    greek: "ἀμβρόσιαι δʼ ἄρα χαῖται ἐπερρώσαντο ἄνακτος"
  - citation: "1.530"
    sequence: 530
    greek: "κρατὸς ἀπʼ ἀθανάτοιο μέγαν δʼ ἐλέλιξεν Ὄλυμπον"
  - citation: "1.531"
    sequence: 531
    greek: "τώ γʼ ὣς βουλεύσαντε διέτμαγεν ἣ μὲν ἔπειτα"
  - citation: "1.532"
    sequence: 532
    greek: "εἰς ἅλα ἆλτο βαθεῖαν ἀπʼ αἰγλήεντος Ὀλύμπου"
  - citation: "1.533"
    sequence: 533
    greek: "Ζεὺς δὲ ἑὸν πρὸς δῶμα θεοὶ δʼ ἅμα πάντες ἀνέσταν"
  - citation: "1.534"
    sequence: 534
    greek: "ἐξ ἑδέων σφοῦ πατρὸς ἐναντίον οὐδέ τις ἔτλη"
  - citation: "1.535"
    sequence: 535
    greek: "μεῖναι ἐπερχόμενον ἀλλʼ ἀντίοι ἔσταν ἅπαντες"
  - citation: "1.536"
    sequence: 536
    greek: "ὣς ὃ μὲν ἔνθα καθέζετʼ ἐπὶ θρόνου οὐδέ μιν Ἥρη"
  - citation: "1.537"
    sequence: 537
    greek: "ἠγνοίησεν ἰδοῦσʼ ὅτι οἱ συμφράσσατο βουλὰς"
  - citation: "1.538"
    sequence: 538
    greek: "ἀργυρόπεζα Θέτις θυγάτηρ ἁλίοιο γέροντος"
  - citation: "1.539"
    sequence: 539
    greek: "αὐτίκα κερτομίοισι Δία Κρονίωνα προσηύδα"
  - citation: "1.540"
    sequence: 540
    greek: "τίς δʼ αὖ τοι δολομῆτα θεῶν συμφράσσατο βουλάς"
  - citation: "1.541"
    sequence: 541
    greek: "αἰεί τοι φίλον ἐστὶν ἐμεῦ ἀπὸ νόσφιν ἐόντα"
  - citation: "1.542"
    sequence: 542
    greek: "κρυπτάδια φρονέοντα δικαζέμεν οὐδέ τί πώ μοι"
  - citation: "1.543"
    sequence: 543
    greek: "πρόφρων τέτληκας εἰπεῖν ἔπος ὅττι νοήσῃς"
  - citation: "1.544"
    sequence: 544
    greek: "τὴν δʼ ἠμείβετʼ ἔπειτα πατὴρ ἀνδρῶν τε θεῶν τε"
  - citation: "1.545"
    sequence: 545
    greek: "Ἥρη μὴ δὴ πάντας ἐμοὺς ἐπιέλπεο μύθους"
  - citation: "1.546"
    sequence: 546
    greek: "εἰδήσειν χαλεποί τοι ἔσοντʼ ἀλόχῳ περ ἐούσῃ"
  - citation: "1.547"
    sequence: 547
    greek: "ἀλλʼ ὃν μέν κʼ ἐπιεικὲς ἀκουέμεν οὔ τις ἔπειτα"
  - citation: "1.548"
    sequence: 548
    greek: "οὔτε θεῶν πρότερος τὸν εἴσεται οὔτʼ ἀνθρώπων"
  - citation: "1.549"
    sequence: 549
    greek: "ὃν δέ κʼ ἐγὼν ἀπάνευθε θεῶν ἐθέλωμι νοῆσαι"
  - citation: "1.550"
    sequence: 550
    greek: "μή τι σὺ ταῦτα ἕκαστα διείρεο μηδὲ μετάλλα"
  - citation: "1.551"
    sequence: 551
    greek: "τὸν δʼ ἠμείβετʼ ἔπειτα βοῶπις πότνια Ἥρη"
  - citation: "1.552"
    sequence: 552
    greek: "αἰνότατε Κρονίδη ποῖον τὸν μῦθον ἔειπες"
  - citation: "1.553"
    sequence: 553
    greek: "καὶ λίην σε πάρος γʼ οὔτʼ εἴρομαι οὔτε μεταλλῶ"
  - citation: "1.554"
    sequence: 554
    greek: "ἀλλὰ μάλʼ εὔκηλος τὰ φράζεαι ἅσσʼ ἐθέλῃσθα"
  - citation: "1.555"
    sequence: 555
    greek: "νῦν δʼ αἰνῶς δείδοικα κατὰ φρένα μή σε παρείπῃ"
  - citation: "1.556"
    sequence: 556
    greek: "ἀργυρόπεζα Θέτις θυγάτηρ ἁλίοιο γέροντος"
  - citation: "1.557"
    sequence: 557
    greek: "ἠερίη γὰρ σοί γε παρέζετο καὶ λάβε γούνων"
  - citation: "1.558"
    sequence: 558
    greek: "τῇ σʼ ὀΐω κατανεῦσαι ἐτήτυμον ὡς Ἀχιλῆα"
  - citation: "1.559"
    sequence: 559
    greek: "τιμήσῃς ὀλέσῃς δὲ πολέας ἐπὶ νηυσὶν Ἀχαιῶν"
  - citation: "1.560"
    sequence: 560
    greek: "τὴν δʼ ἀπαμειβόμενος προσέφη νεφεληγερέτα Ζεύς"
  - citation: "1.561"
    sequence: 561
    greek: "δαιμονίη αἰεὶ μὲν ὀΐεαι οὐδέ σε λήθω"
  - citation: "1.562"
    sequence: 562
    greek: "πρῆξαι δʼ ἔμπης οὔ τι δυνήσεαι ἀλλʼ ἀπὸ θυμοῦ"
  - citation: "1.563"
    sequence: 563
    greek: "μᾶλλον ἐμοὶ ἔσεαι τὸ δέ τοι καὶ ῥίγιον ἔσται"
  - citation: "1.564"
    sequence: 564
    greek: "εἰ δʼ οὕτω τοῦτʼ ἐστὶν ἐμοὶ μέλλει φίλον εἶναι"
  - citation: "1.565"
    sequence: 565
    greek: "ἀλλʼ ἀκέουσα κάθησο ἐμῷ δʼ ἐπιπείθεο μύθῳ"
  - citation: "1.566"
    sequence: 566
    greek: "μή νύ τοι οὐ χραίσμωσιν ὅσοι θεοί εἰσʼ ἐν Ὀλύμπῳ"
  - citation: "1.567"
    sequence: 567
    greek: "ἆσσον ἰόνθʼ ὅτε κέν τοι ἀάπτους χεῖρας ἐφείω"
  - citation: "1.568"
    sequence: 568
    greek: "ὣς ἔφατʼ ἔδεισεν δὲ βοῶπις πότνια Ἥρη"
  - citation: "1.569"
    sequence: 569
    greek: "καί ῥʼ ἀκέουσα καθῆστο ἐπιγνάμψασα φίλον κῆρ"
  - citation: "1.570"
    sequence: 570
    greek: "ὄχθησαν δʼ ἀνὰ δῶμα Διὸς θεοὶ Οὐρανίωνες"
  - citation: "1.571"
    sequence: 571
    greek: "τοῖσιν δʼ Ἥφαιστος κλυτοτέχνης ἦρχʼ ἀγορεύειν"
  - citation: "1.572"
    sequence: 572
    greek: "μητρὶ φίλῃ ἐπίηρα φέρων λευκωλένῳ Ἥρῃ"
  - citation: "1.573"
    sequence: 573
    greek: "ἦ δὴ λοίγια ἔργα τάδʼ ἔσσεται οὐδʼ ἔτʼ ἀνεκτά"
  - citation: "1.574"
    sequence: 574
    greek: "εἰ δὴ σφὼ ἕνεκα θνητῶν ἐριδαίνετον ὧδε"
  - citation: "1.575"
    sequence: 575
    greek: "ἐν δὲ θεοῖσι κολῳὸν ἐλαύνετον οὐδέ τι δαιτὸς"
  - citation: "1.576"
    sequence: 576
    greek: "ἐσθλῆς ἔσσεται ἦδος ἐπεὶ τὰ χερείονα νικᾷ"
  - citation: "1.577"
    sequence: 577
    greek: "μητρὶ δʼ ἐγὼ παράφημι καὶ αὐτῇ περ νοεούσῃ"
  - citation: "1.578"
    sequence: 578
    greek: "πατρὶ φίλῳ ἐπίηρα φέρειν Διί ὄφρα μὴ αὖτε"
  - citation: "1.579"
    sequence: 579
    greek: "νεικείῃσι πατήρ σὺν δʼ ἡμῖν δαῖτα ταράξῃ"
  - citation: "1.580"
    sequence: 580
    greek: "εἴ περ γάρ κʼ ἐθέλῃσιν Ὀλύμπιος ἀστεροπητὴς"
  - citation: "1.581"
    sequence: 581
    greek: "ἐξ ἑδέων στυφελίξαι ὃ γὰρ πολὺ φέρτατός ἐστιν"
  - citation: "1.582"
    sequence: 582
    greek: "ἀλλὰ σὺ τὸν ἐπέεσσι καθάπτεσθαι μαλακοῖσιν"
  - citation: "1.583"
    sequence: 583
    greek: "αὐτίκʼ ἔπειθʼ ἵλαος Ὀλύμπιος ἔσσεται ἡμῖν"
  - citation: "1.584"
    sequence: 584
    greek: "ὣς ἄρʼ ἔφη καὶ ἀναΐξας δέπας ἀμφικύπελλον"
  - citation: "1.585"
    sequence: 585
    greek: "μητρὶ φίλῃ ἐν χειρὶ τίθει καί μιν προσέειπε"
  - citation: "1.586"
    sequence: 586
    greek: "τέτλαθι μῆτερ ἐμή καὶ ἀνάσχεο κηδομένη περ"
  - citation: "1.587"
    sequence: 587
    greek: "μή σε φίλην περ ἐοῦσαν ἐν ὀφθαλμοῖσιν ἴδωμαι"
  - citation: "1.588"
    sequence: 588
    greek: "θεινομένην τότε δʼ οὔ τι δυνήσομαι ἀχνύμενός περ"
  - citation: "1.589"
    sequence: 589
    greek: "χραισμεῖν ἀργαλέος γὰρ Ὀλύμπιος ἀντιφέρεσθαι"
  - citation: "1.590"
    sequence: 590
    greek: "ἤδη γάρ με καὶ ἄλλοτʼ ἀλεξέμεναι μεμαῶτα"
  - citation: "1.591"
    sequence: 591
    greek: "ῥῖψε ποδὸς τεταγὼν ἀπὸ βηλοῦ θεσπεσίοιο"
  - citation: "1.592"
    sequence: 592
    greek: "πᾶν δʼ ἦμαρ φερόμην ἅμα δʼ ἠελίῳ καταδύντι"
  - citation: "1.593"
    sequence: 593
    greek: "κάππεσον ἐν Λήμνῳ ὀλίγος δʼ ἔτι θυμὸς ἐνῆεν"
  - citation: "1.594"
    sequence: 594
    greek: "ἔνθά με Σίντιες ἄνδρες ἄφαρ κομίσαντο πεσόντα"
  - citation: "1.595"
    sequence: 595
    greek: "ὣς φάτο μείδησεν δὲ θεὰ λευκώλενος Ἥρη"
  - citation: "1.596"
    sequence: 596
    greek: "μειδήσασα δὲ παιδὸς ἐδέξατο χειρὶ κύπελλον"
  - citation: "1.597"
    sequence: 597
    greek: "αὐτὰρ ὃ τοῖς ἄλλοισι θεοῖς ἐνδέξια πᾶσιν"
  - citation: "1.598"
    sequence: 598
    greek: "οἰνοχόει γλυκὺ νέκταρ ἀπὸ κρητῆρος ἀφύσσων"
  - citation: "1.599"
    sequence: 599
    greek: "ἄσβεστος δʼ ἄρʼ ἐνῶρτο γέλως μακάρεσσι θεοῖσιν"
  - citation: "1.600"
    sequence: 600
    greek: "ὡς ἴδον Ἥφαιστον διὰ δώματα ποιπνύοντα"
  - citation: "1.601"
    sequence: 601
    greek: "ὣς τότε μὲν πρόπαν ἦμαρ ἐς ἠέλιον καταδύντα"
  - citation: "1.602"
    sequence: 602
    greek: "δαίνυντʼ οὐδέ τι θυμὸς ἐδεύετο δαιτὸς ἐΐσης"
  - citation: "1.603"
    sequence: 603
    greek: "οὐ μὲν φόρμιγγος περικαλλέος ἣν ἔχʼ Ἀπόλλων"
  - citation: "1.604"
    sequence: 604
    greek: "Μουσάων θʼ αἳ ἄειδον ἀμειβόμεναι ὀπὶ καλῇ"
  - citation: "1.605"
    sequence: 605
    greek: "αὐτὰρ ἐπεὶ κατέδυ λαμπρὸν φάος ἠελίοιο"
  - citation: "1.606"
    sequence: 606
    greek: "οἳ μὲν κακκείοντες ἔβαν οἶκον δὲ ἕκαστος"
  - citation: "1.607"
    sequence: 607
    greek: "ἧχι ἑκάστῳ δῶμα περικλυτὸς ἀμφιγυήεις"
  - citation: "1.608"
    sequence: 608
    greek: "Ἥφαιστος ποίησεν ἰδυίῃσι πραπίδεσσι"
  - citation: "1.609"
    sequence: 609
    greek: "Ζεὺς δὲ πρὸς ὃν λέχος ἤϊʼ Ὀλύμπιος ἀστεροπητής"
  - citation: "1.610"
    sequence: 610
    greek: "ἔνθα πάρος κοιμᾶθʼ ὅτε μιν γλυκὺς ὕπνος ἱκάνοι"
  - citation: "1.611"
    sequence: 611
    greek: "ἔνθα καθεῦδʼ ἀναβάς παρὰ δὲ χρυσόθρονος Ἥρη"
