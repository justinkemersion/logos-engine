passages:
  - citation: "1.1"
    sequence: 1
    greek: "ἄνδρα μοι ἔννεπε μοῦσα πολύτροπον ὃς μάλα πολλὰ"
  - citation: "1.2"
    sequence: 2
    greek: "πλάγχθη ἐπεὶ Τροίης ἱερὸν πτολίεθρον ἔπερσεν"
  - citation: "1.3"
    sequence: 3
    greek: "πολλῶν δʼ ἀνθρώπων ἴδεν ἄστεα καὶ νόον ἔγνω"
  - citation: "1.4"
    sequence: 4
    greek: "πολλὰ δʼ ὅ γʼ ἐν πόντῳ πάθεν ἄλγεα ὃν κατὰ θυμόν"
  - citation: "1.5"
    sequence: 5
    greek: "ἀρνύμενος ἥν τε ψυχὴν καὶ νόστον ἑταίρων"
  - citation: "1.6"
    sequence: 6
    greek: "ἀλλʼ οὐδʼ ὣς ἑτάρους ἐρρύσατο ἱέμενός περ"
  - citation: "1.7"
    sequence: 7
    greek: "αὐτῶν γὰρ σφετέρῃσιν ἀτασθαλίῃσιν ὄλοντο"
  - citation: "1.8"
    sequence: 8
    greek: "νήπιοι οἳ κατὰ βοῦς Ὑπερίονος Ἠελίοιο"
  - citation: "1.9"
    sequence: 9
    greek: "ἤσθιον αὐτὰρ ὁ τοῖσιν ἀφείλετο νόστιμον ἦμαρ"
  - citation: "1.10"
    sequence: 10
    greek: "τῶν ἁμόθεν γε θεά θύγατερ Διός εἰπὲ καὶ ἡμῖν"
  - citation: "1.11"
    sequence: 11
    greek: "ἔνθʼ ἄλλοι μὲν πάντες ὅσοι φύγον αἰπὺν ὄλεθρον"
  - citation: "1.12"
    sequence: 12
    greek: "οἴκοι ἔσαν πόλεμόν τε πεφευγότες ἠδὲ θάλασσαν"
  - citation: "1.13"
    sequence: 13
    greek: "τὸν δʼ οἶον νόστου κεχρημένον ἠδὲ γυναικὸς"
  - citation: "1.14"
    sequence: 14
    greek: "νύμφη πότνιʼ ἔρυκε Καλυψὼ δῖα θεάων"
  - citation: "1.15"
    sequence: 15
    greek: "ἐν σπέσσι γλαφυροῖσι λιλαιομένη πόσιν εἶναι"
  - citation: "1.16"
    sequence: 16
    greek: "ἀλλʼ ὅτε δὴ ἔτος ἦλθε περιπλομένων ἐνιαυτῶν"
  - citation: "1.17"
    sequence: 17
    greek: "τῷ οἱ ἐπεκλώσαντο θεοὶ οἶκόνδε νέεσθαι"
  - citation: "1.18"
    sequence: 18
    greek: "εἰς Ἰθάκην οὐδʼ ἔνθα πεφυγμένος ἦεν ἀέθλων"
  - citation: "1.19"
    sequence: 19
    greek: "καὶ μετὰ οἷσι φίλοισι θεοὶ δʼ ἐλέαιρον ἅπαντες"
  - citation: "1.20"
    sequence: 20
    greek: "νόσφι Ποσειδάωνος ὁ δʼ ἀσπερχὲς μενέαινεν"
  - citation: "1.21"
    sequence: 21
    greek: "ἀντιθέῳ Ὀδυσῆι πάρος ἣν γαῖαν ἱκέσθαι"
  - citation: "1.22"
    sequence: 22
    greek: "ἀλλʼ ὁ μὲν Αἰθίοπας μετεκίαθε τηλόθʼ ἐόντας"
  - citation: "1.23"
    sequence: 23
    greek: "Αἰθίοπας τοὶ διχθὰ δεδαίαται ἔσχατοι ἀνδρῶν"
  - citation: "1.24"
    sequence: 24
    greek: "οἱ μὲν δυσομένου Ὑπερίονος οἱ δʼ ἀνιόντος"
  - citation: "1.25"
    sequence: 25
    greek: "ἀντιόων ταύρων τε καὶ ἀρνειῶν ἑκατόμβης"
  - citation: "1.26"
    sequence: 26
    greek: "ἔνθʼ ὅ γʼ ἐτέρπετο δαιτὶ παρήμενος οἱ δὲ δὴ ἄλλοι"
  - citation: "1.27"
    sequence: 27
    greek: "Ζηνὸς ἐνὶ μεγάροισιν Ὀλυμπίου ἁθρόοι ἦσαν"
  - citation: "1.28"
    sequence: 28
    greek: "τοῖσι δὲ μύθων ἦρχε πατὴρ ἀνδρῶν τε θεῶν τε"
  - citation: "1.29"
    sequence: 29
    greek: "μνήσατο γὰρ κατὰ θυμὸν ἀμύμονος Αἰγίσθοιο"
  - citation: "1.30"
    sequence: 30
    greek: "τόν ῥʼ Ἀγαμεμνονίδης τηλεκλυτὸς ἔκτανʼ Ὀρέστης"
  - citation: "1.31"
    sequence: 31
    greek: "τοῦ ὅ γʼ ἐπιμνησθεὶς ἔπεʼ ἀθανάτοισι μετηύδα"
  - citation: "1.32"
    sequence: 32
    greek: "ὢ πόποι οἷον δή νυ θεοὺς βροτοὶ αἰτιόωνται"
  - citation: "1.33"
    sequence: 33
    greek: "ἐξ ἡμέων γάρ φασι κάκʼ ἔμμεναι οἱ δὲ καὶ αὐτοὶ"
  - citation: "1.34"
    sequence: 34
    greek: "σφῇσιν ἀτασθαλίῃσιν ὑπὲρ μόρον ἄλγεʼ ἔχουσιν"
  - citation: "1.35"
    sequence: 35
    greek: "ὡς καὶ νῦν Αἴγισθος ὑπὲρ μόρον Ἀτρεΐδαο"
  - citation: "1.36"
    sequence: 36
    greek: "γῆμʼ ἄλοχον μνηστήν τὸν δʼ ἔκτανε νοστήσαντα"
  - citation: "1.37"
    sequence: 37
    greek: "εἰδὼς αἰπὺν ὄλεθρον ἐπεὶ πρό οἱ εἴπομεν ἡμεῖς"
  - citation: "1.38"
    sequence: 38
    greek: "Ἑρμείαν πέμψαντες ἐύσκοπον ἀργεϊφόντην"
  - citation: "1.39"
    sequence: 39
    greek: "μήτʼ αὐτὸν κτείνειν μήτε μνάασθαι ἄκοιτιν"
  - citation: "1.40"
    sequence: 40
    greek: "ἐκ γὰρ Ὀρέσταο τίσις ἔσσεται Ἀτρεΐδαο"
  - citation: "1.41"
    sequence: 41
    greek: "ὁππότʼ ἂν ἡβήσῃ τε καὶ ἧς ἱμείρεται αἴης"
  - citation: "1.42"
    sequence: 42
    greek: "ὣς ἔφαθʼ Ἑρμείας ἀλλʼ οὐ φρένας Αἰγίσθοιο"
  - citation: "1.43"
    sequence: 43
    greek: "πεῖθʼ ἀγαθὰ φρονέων νῦν δʼ ἁθρόα πάντʼ ἀπέτισεν"
  - citation: "1.44"
    sequence: 44
    greek: "τὸν δʼ ἠμείβετʼ ἔπειτα θεά γλαυκῶπις Ἀθήνη"
  - citation: "1.45"
    sequence: 45
    greek: "ὦ πάτερ ἡμέτερε Κρονίδη ὕπατε κρειόντων"
  - citation: "1.46"
    sequence: 46
    greek: "καὶ λίην κεῖνός γε ἐοικότι κεῖται ὀλέθρῳ"
  - citation: "1.47"
    sequence: 47
    greek: "ὡς ἀπόλοιτο καὶ ἄλλος ὅτις τοιαῦτά γε ῥέζοι"
  - citation: "1.48"
    sequence: 48
    greek: "ἀλλά μοι ἀμφʼ Ὀδυσῆι δαΐφρονι δαίεται ἦτορ"
  - citation: "1.49"
    sequence: 49
    greek: "δυσμόρῳ ὃς δὴ δηθὰ φίλων ἄπο πήματα πάσχει"
  - citation: "1.50"
    sequence: 50
    greek: "νήσῳ ἐν ἀμφιρύτῃ ὅθι τʼ ὀμφαλός ἐστι θαλάσσης"
  - citation: "1.51"
    sequence: 51
    greek: "νῆσος δενδρήεσσα θεὰ δʼ ἐν δώματα ναίει"
  - citation: "1.52"
    sequence: 52
    greek: "Ἄτλαντος θυγάτηρ ὀλοόφρονος ὅς τε θαλάσσης"
  - citation: "1.53"
    sequence: 53
    greek: "πάσης βένθεα οἶδεν ἔχει δέ τε κίονας αὐτὸς"
  - citation: "1.54"
    sequence: 54
    greek: "μακράς αἳ γαῖάν τε καὶ οὐρανὸν ἀμφὶς ἔχουσιν"
  - citation: "1.55"
    sequence: 55
    greek: "τοῦ θυγάτηρ δύστηνον ὀδυρόμενον κατερύκει"
  - citation: "1.56"
    sequence: 56
    greek: "αἰεὶ δὲ μαλακοῖσι καὶ αἱμυλίοισι λόγοισιν"
  - citation: "1.57"
    sequence: 57
    greek: "θέλγει ὅπως Ἰθάκης ἐπιλήσεται αὐτὰρ Ὀδυσσεύς"
  - citation: "1.58"
    sequence: 58
    greek: "ἱέμενος καὶ καπνὸν ἀποθρῴσκοντα νοῆσαι"
  - citation: "1.59"
    sequence: 59
    greek: "ἧς γαίης θανέειν ἱμείρεται οὐδέ νυ σοί περ"
  - citation: "1.60"
    sequence: 60
    greek: "ἐντρέπεται φίλον ἦτορ Ὀλύμπιε οὔ νύ τʼ Ὀδυσσεὺς"
  - citation: "1.61"
    sequence: 61
    greek: "Ἀργείων παρὰ νηυσὶ χαρίζετο ἱερὰ ῥέζων"
  - citation: "1.62"
    sequence: 62
    greek: "Τροίῃ ἐν εὐρείῃ τί νύ οἱ τόσον ὠδύσαο Ζεῦ"
  - citation: "1.63"
    sequence: 63
    greek: "τὴν δʼ ἀπαμειβόμενος προσέφη νεφεληγερέτα Ζεύς"
  - citation: "1.64"
    sequence: 64
    greek: "τέκνον ἐμόν ποῖόν σε ἔπος φύγεν ἕρκος ὀδόντων"
  - citation: "1.65"
    sequence: 65
    greek: "πῶς ἂν ἔπειτʼ Ὀδυσῆος ἐγὼ θείοιο λαθοίμην"
  - citation: "1.66"
    sequence: 66
    greek: "ὃς περὶ μὲν νόον ἐστὶ βροτῶν περὶ δʼ ἱρὰ θεοῖσιν"
  - citation: "1.67"
    sequence: 67
    greek: "ἀθανάτοισιν ἔδωκε τοὶ οὐρανὸν εὐρὺν ἔχουσιν"
  - citation: "1.68"
    sequence: 68
    greek: "ἀλλὰ Ποσειδάων γαιήοχος ἀσκελὲς αἰεὶ"
  - citation: "1.69"
    sequence: 69
    greek: "Κύκλωπος κεχόλωται ὃν ὀφθαλμοῦ ἀλάωσεν"
  - citation: "1.70"
    sequence: 70
    greek: "ἀντίθεον Πολύφημον ὅου κράτος ἐστὶ μέγιστον"
  - citation: "1.71"
    sequence: 71
    greek: "πᾶσιν Κυκλώπεσσι Θόωσα δέ μιν τέκε νύμφη"
  - citation: "1.72"
    sequence: 72
    greek: "Φόρκυνος θυγάτηρ ἁλὸς ἀτρυγέτοιο μέδοντος"
  - citation: "1.73"
    sequence: 73
    greek: "ἐν σπέσσι γλαφυροῖσι Ποσειδάωνι μιγεῖσα"
  - citation: "1.74"
    sequence: 74
    greek: "ἐκ τοῦ δὴ Ὀδυσῆα Ποσειδάων ἐνοσίχθων"
  - citation: "1.75"
    sequence: 75
    greek: "οὔ τι κατακτείνει πλάζει δʼ ἀπὸ πατρίδος αἴης"
  - citation: "1.76"
    sequence: 76
    greek: "ἀλλʼ ἄγεθʼ ἡμεῖς οἵδε περιφραζώμεθα πάντες"
  - citation: "1.77"
    sequence: 77
    greek: "νόστον ὅπως ἔλθῃσι Ποσειδάων δὲ μεθήσει"
  - citation: "1.78"
    sequence: 78
    greek: "ὃν χόλον οὐ μὲν γάρ τι δυνήσεται ἀντία πάντων"
  - citation: "1.79"
    sequence: 79
    greek: "ἀθανάτων ἀέκητι θεῶν ἐριδαινέμεν οἶος"
  - citation: "1.80"
    sequence: 80
    greek: "τὸν δʼ ἠμείβετʼ ἔπειτα θεά γλαυκῶπις Ἀθήνη"
  - citation: "1.81"
    sequence: 81
    greek: "ὦ πάτερ ἡμέτερε Κρονίδη ὕπατε κρειόντων"
  - citation: "1.82"
    sequence: 82
    greek: "εἰ μὲν δὴ νῦν τοῦτο φίλον μακάρεσσι θεοῖσιν"
  - citation: "1.83"
    sequence: 83
    greek: "νοστῆσαι Ὀδυσῆα πολύφρονα ὅνδε δόμονδε"
  - citation: "1.84"
    sequence: 84
    greek: "Ἑρμείαν μὲν ἔπειτα διάκτορον ἀργεϊφόντην"
  - citation: "1.85"
    sequence: 85
    greek: "νῆσον ἐς Ὠγυγίην ὀτρύνομεν ὄφρα τάχιστα"
  - citation: "1.86"
    sequence: 86
    greek: "νύμφῃ ἐυπλοκάμῳ εἴπῃ νημερτέα βουλήν"
  - citation: "1.87"
    sequence: 87
    greek: "νόστον Ὀδυσσῆος ταλασίφρονος ὥς κε νέηται"
  - citation: "1.88"
    sequence: 88
    greek: "αὐτὰρ ἐγὼν Ἰθάκηνδʼ ἐσελεύσομαι ὄφρα οἱ υἱὸν"
  - citation: "1.89"
    sequence: 89
    greek: "μᾶλλον ἐποτρύνω καί οἱ μένος ἐν φρεσὶ θείω"
  - citation: "1.90"
    sequence: 90
    greek: "εἰς ἀγορὴν καλέσαντα κάρη κομόωντας Ἀχαιοὺς"
  - citation: "1.91"
    sequence: 91
    greek: "πᾶσι μνηστήρεσσιν ἀπειπέμεν οἵ τέ οἱ αἰεὶ"
  - citation: "1.92"
    sequence: 92
    greek: "μῆλʼ ἁδινὰ σφάζουσι καὶ εἰλίποδας ἕλικας βοῦς"
  - citation: "1.93"
    sequence: 93
    greek: "πέμψω δʼ ἐς Σπάρτην τε καὶ ἐς Πύλον ἠμαθόεντα"
  - citation: "1.94"
    sequence: 94
    greek: "νόστον πευσόμενον πατρὸς φίλου ἤν που ἀκούσῃ"
  - citation: "1.95"
    sequence: 95
    greek: "ἠδʼ ἵνα μιν κλέος ἐσθλὸν ἐν ἀνθρώποισιν ἔχῃσιν"
  - citation: "1.96"
    sequence: 96
    greek: "ὣς εἰποῦσʼ ὑπὸ ποσσὶν ἐδήσατο καλὰ πέδιλα"
  - citation: "1.97"
    sequence: 97
    greek: "ἀμβρόσια χρύσεια τά μιν φέρον ἠμὲν ἐφʼ ὑγρὴν"
  - citation: "1.98"
    sequence: 98
    greek: "ἠδʼ ἐπʼ ἀπείρονα γαῖαν ἅμα πνοιῇς ἀνέμοιο"
  - citation: "1.99"
    sequence: 99
    greek: "εἵλετο δʼ ἄλκιμον ἔγχος ἀκαχμένον ὀξέι χαλκῷ"
  - citation: "1.100"
    sequence: 100
    greek: "βριθὺ μέγα στιβαρόν τῷ δάμνησι στίχας ἀνδρῶν"
  - citation: "1.101"
    sequence: 101
    greek: "ἡρώων τοῖσίν τε κοτέσσεται ὀβριμοπάτρη"
  - citation: "1.102"
    sequence: 102
    greek: "βῆ δὲ κατʼ Οὐλύμποιο καρήνων ἀίξασα"
  - citation: "1.103"
    sequence: 103
    greek: "στῆ δʼ Ἰθάκης ἐνὶ δήμῳ ἐπὶ προθύροις Ὀδυσῆος"
  - citation: "1.104"
    sequence: 104
    greek: "οὐδοῦ ἐπʼ αὐλείου παλάμῃ δʼ ἔχε χάλκεον ἔγχος"
  - citation: "1.105"
    sequence: 105
    greek: "εἰδομένη ξείνῳ Ταφίων ἡγήτορι Μέντῃ"
  - citation: "1.106"
    sequence: 106
    greek: "εὗρε δʼ ἄρα μνηστῆρας ἀγήνορας οἱ μὲν ἔπειτα"
  - citation: "1.107"
    sequence: 107
    greek: "πεσσοῖσι προπάροιθε θυράων θυμὸν ἔτερπον"
  - citation: "1.108"
    sequence: 108
    greek: "ἥμενοι ἐν ῥινοῖσι βοῶν οὓς ἔκτανον αὐτοί"
  - citation: "1.109"
    sequence: 109
    greek: "κήρυκες δʼ αὐτοῖσι καὶ ὀτρηροὶ θεράποντες"
  - citation: "1.110"
    sequence: 110
    greek: "οἱ μὲν οἶνον ἔμισγον ἐνὶ κρητῆρσι καὶ ὕδωρ"
  - citation: "1.111"
    sequence: 111
    greek: "οἱ δʼ αὖτε σπόγγοισι πολυτρήτοισι τραπέζας"
  - citation: "1.112"
    sequence: 112
    greek: "νίζον καὶ πρότιθεν τοὶ δὲ κρέα πολλὰ δατεῦντο"
  - citation: "1.113"
    sequence: 113
    greek: "τὴν δὲ πολὺ πρῶτος ἴδε Τηλέμαχος θεοειδής"
  - citation: "1.114"
    sequence: 114
    greek: "ἧστο γὰρ ἐν μνηστῆρσι φίλον τετιημένος ἦτορ"
  - citation: "1.115"
    sequence: 115
    greek: "ὀσσόμενος πατέρʼ ἐσθλὸν ἐνὶ φρεσίν εἴ ποθεν ἐλθὼν"
  - citation: "1.116"
    sequence: 116
    greek: "μνηστήρων τῶν μὲν σκέδασιν κατὰ δώματα θείη"
  - citation: "1.117"
    sequence: 117
    greek: "τιμὴν δʼ αὐτὸς ἔχοι καὶ δώμασιν οἷσιν ἀνάσσοι"
  - citation: "1.118"
    sequence: 118
    greek: "τὰ φρονέων μνηστῆρσι μεθήμενος εἴσιδʼ Ἀθήνην"
  - citation: "1.119"
    sequence: 119
    greek: "βῆ δʼ ἰθὺς προθύροιο νεμεσσήθη δʼ ἐνὶ θυμῷ"
  - citation: "1.120"
    sequence: 120
    greek: "ξεῖνον δηθὰ θύρῃσιν ἐφεστάμεν ἐγγύθι δὲ στὰς"
  - citation: "1.121"
    sequence: 121
    greek: "χεῖρʼ ἕλε δεξιτερὴν καὶ ἐδέξατο χάλκεον ἔγχος"
  - citation: "1.122"
    sequence: 122
    greek: "καί μιν φωνήσας ἔπεα πτερόεντα προσηύδα"
  - citation: "1.123"
    sequence: 123
    greek: "χαῖρε ξεῖνε παρʼ ἄμμι φιλήσεαι αὐτὰρ ἔπειτα"
  - citation: "1.124"
    sequence: 124
    greek: "δείπνου πασσάμενος μυθήσεαι ὅττεό σε χρή"
  - citation: "1.125"
    sequence: 125
    greek: "ὣς εἰπὼν ἡγεῖθʼ ἡ δʼ ἕσπετο Παλλὰς Ἀθήνη"
  - citation: "1.126"
    sequence: 126
    greek: "οἱ δʼ ὅτε δή ῥʼ ἔντοσθεν ἔσαν δόμου ὑψηλοῖο"
  - citation: "1.127"
    sequence: 127
    greek: "ἔγχος μέν ῥʼ ἔστησε φέρων πρὸς κίονα μακρὴν"
  - citation: "1.128"
    sequence: 128
    greek: "δουροδόκης ἔντοσθεν ἐυξόου ἔνθα περ ἄλλα"
  - citation: "1.129"
    sequence: 129
    greek: "ἔγχεʼ Ὀδυσσῆος ταλασίφρονος ἵστατο πολλά"
  - citation: "1.130"
    sequence: 130
    greek: "αὐτὴν δʼ ἐς θρόνον εἷσεν ἄγων ὑπὸ λῖτα πετάσσας"
  - citation: "1.131"
    sequence: 131
    greek: "καλὸν δαιδάλεον ὑπὸ δὲ θρῆνυς ποσὶν ἦεν"
  - citation: "1.132"
    sequence: 132
    greek: "πὰρ δʼ αὐτὸς κλισμὸν θέτο ποικίλον ἔκτοθεν ἄλλων"
  - citation: "1.133"
    sequence: 133
    greek: "μνηστήρων μὴ ξεῖνος ἀνιηθεὶς ὀρυμαγδῷ"
  - citation: "1.134"
    sequence: 134
    greek: "δείπνῳ ἁδήσειεν ὑπερφιάλοισι μετελθών"
  - citation: "1.135"
    sequence: 135
    greek: "ἠδʼ ἵνα μιν περὶ πατρὸς ἀποιχομένοιο ἔροιτο"
  - citation: "1.136"
    sequence: 136
    greek: "χέρνιβα δʼ ἀμφίπολος προχόῳ ἐπέχευε φέρουσα"
  - citation: "1.137"
    sequence: 137
    greek: "καλῇ χρυσείῃ ὑπὲρ ἀργυρέοιο λέβητος"
  - citation: "1.138"
    sequence: 138
    greek: "νίψασθαι παρὰ δὲ ξεστὴν ἐτάνυσσε τράπεζαν"
  - citation: "1.139"
    sequence: 139
    greek: "σῖτον δʼ αἰδοίη ταμίη παρέθηκε φέρουσα"
  - citation: "1.140"
    sequence: 140
    greek: "εἴδατα πόλλʼ ἐπιθεῖσα χαριζομένη παρεόντων"
  - citation: "1.141"
    sequence: 141
    greek: "δαιτρὸς δὲ κρειῶν πίνακας παρέθηκεν ἀείρας"
  - citation: "1.142"
    sequence: 142
    greek: "παντοίων παρὰ δέ σφι τίθει χρύσεια κύπελλα"
  - citation: "1.143"
    sequence: 143
    greek: "κῆρυξ δʼ αὐτοῖσιν θάμʼ ἐπῴχετο οἰνοχοεύων"
  - citation: "1.144"
    sequence: 144
    greek: "ἐς δʼ ἦλθον μνηστῆρες ἀγήνορες οἱ μὲν ἔπειτα"
  - citation: "1.145"
    sequence: 145
    greek: "ἑξείης ἕζοντο κατὰ κλισμούς τε θρόνους τε"
  - citation: "1.146"
    sequence: 146
    greek: "τοῖσι δὲ κήρυκες μὲν ὕδωρ ἐπὶ χεῖρας ἔχευαν"
  - citation: "1.147"
    sequence: 147
    greek: "σῖτον δὲ δμῳαὶ παρενήνεον ἐν κανέοισιν"
  - citation: "1.148"
    sequence: 148
    greek: "κοῦροι δὲ κρητῆρας ἐπεστέψαντο ποτοῖο"
  - citation: "1.149"
    sequence: 149
    greek: "οἱ δʼ ἐπʼ ὀνείαθʼ ἑτοῖμα προκείμενα χεῖρας ἴαλλον"
  - citation: "1.150"
    sequence: 150
    greek: "αὐτὰρ ἐπεὶ πόσιος καὶ ἐδητύος ἐξ ἔρον ἕντο"
  - citation: "1.151"
    sequence: 151
    greek: "μνηστῆρες τοῖσιν μὲν ἐνὶ φρεσὶν ἄλλα μεμήλει"
  - citation: "1.152"
    sequence: 152
    greek: "μολπή τʼ ὀρχηστύς τε τὰ γάρ τʼ ἀναθήματα δαιτός"
  - citation: "1.153"
    sequence: 153
    greek: "κῆρυξ δʼ ἐν χερσὶν κίθαριν περικαλλέα θῆκεν"
  - citation: "1.154"
    sequence: 154
    greek: "Φημίῳ ὅς ῥʼ ἤειδε παρὰ μνηστῆρσιν ἀνάγκῃ"
  - citation: "1.155"
    sequence: 155
    greek: "ἦ τοι ὁ φορμίζων ἀνεβάλλετο καλὸν ἀείδειν"
  - citation: "1.156"
    sequence: 156
    greek: "αὐτὰρ Τηλέμαχος προσέφη γλαυκῶπιν Ἀθήνην"
  - citation: "1.157"
    sequence: 157
    greek: "ἄγχι σχὼν κεφαλήν ἵνα μὴ πευθοίαθʼ οἱ ἄλλοι"
  - citation: "1.158"
    sequence: 158
    greek: "ξεῖνε φίλʼ ἦ καί μοι νεμεσήσεαι ὅττι κεν εἴπω"
  - citation: "1.159"
    sequence: 159
    greek: "τούτοισιν μὲν ταῦτα μέλει κίθαρις καὶ ἀοιδή"
  - citation: "1.160"
    sequence: 160
    greek: "ῥεῖʼ ἐπεὶ ἀλλότριον βίοτον νήποινον ἔδουσιν"
  - citation: "1.161"
    sequence: 161
    greek: "ἀνέρος οὗ δή που λεύκʼ ὀστέα πύθεται ὄμβρῳ"
  - citation: "1.162"
    sequence: 162
    greek: "κείμενʼ ἐπʼ ἠπείρου ἢ εἰν ἁλὶ κῦμα κυλίνδει"
  - citation: "1.163"
    sequence: 163
    greek: "εἰ κεῖνόν γʼ Ἰθάκηνδε ἰδοίατο νοστήσαντα"
  - citation: "1.164"
    sequence: 164
    greek: "πάντες κʼ ἀρησαίατʼ ἐλαφρότεροι πόδας εἶναι"
  - citation: "1.165"
    sequence: 165
    greek: "ἢ ἀφνειότεροι χρυσοῖό τε ἐσθῆτός τε"
  - citation: "1.166"
    sequence: 166
    greek: "νῦν δʼ ὁ μὲν ὣς ἀπόλωλε κακὸν μόρον οὐδέ τις ἡμῖν"
  - citation: "1.167"
    sequence: 167
    greek: "θαλπωρή εἴ πέρ τις ἐπιχθονίων ἀνθρώπων"
  - citation: "1.168"
    sequence: 168
    greek: "φῇσιν ἐλεύσεσθαι τοῦ δʼ ὤλετο νόστιμον ἦμαρ"
  - citation: "1.169"
    sequence: 169
    greek: "ἀλλʼ ἄγε μοι τόδε εἰπὲ καὶ ἀτρεκέως κατάλεξον"
  - citation: "1.170"
    sequence: 170
    greek: "τίς πόθεν εἰς ἀνδρῶν πόθι τοι πόλις ἠδὲ τοκῆες"
  - citation: "1.171"
    sequence: 171
    greek: "ὁπποίης τʼ ἐπὶ νηὸς ἀφίκεο πῶς δέ σε ναῦται"
  - citation: "1.172"
    sequence: 172
    greek: "ἤγαγον εἰς Ἰθάκην τίνες ἔμμεναι εὐχετόωντο"
  - citation: "1.173"
    sequence: 173
    greek: "οὐ μὲν γάρ τί σε πεζὸν ὀίομαι ἐνθάδʼ ἱκέσθαι"
  - citation: "1.174"
    sequence: 174
    greek: "καί μοι τοῦτʼ ἀγόρευσον ἐτήτυμον ὄφρʼ ἐὺ εἰδῶ"
  - citation: "1.175"
    sequence: 175
    greek: "ἠὲ νέον μεθέπεις ἦ καὶ πατρώιός ἐσσι"
  - citation: "1.176"
    sequence: 176
    greek: "ξεῖνος ἐπεὶ πολλοὶ ἴσαν ἀνέρες ἡμέτερον δῶ"
  - citation: "1.177"
    sequence: 177
    greek: "ἄλλοι ἐπεὶ καὶ κεῖνος ἐπίστροφος ἦν ἀνθρώπων"
  - citation: "1.178"
    sequence: 178
    greek: "τὸν δʼ αὖτε προσέειπε θεά γλαυκῶπις Ἀθήνη"
  - citation: "1.179"
    sequence: 179
    greek: "τοιγὰρ ἐγώ τοι ταῦτα μάλʼ ἀτρεκέως ἀγορεύσω"
  - citation: "1.180"
    sequence: 180
    greek: "Μέντης Ἀγχιάλοιο δαΐφρονος εὔχομαι εἶναι"
  - citation: "1.181"
    sequence: 181
    greek: "υἱός ἀτὰρ Ταφίοισι φιληρέτμοισιν ἀνάσσω"
  - citation: "1.182"
    sequence: 182
    greek: "νῦν δʼ ὧδε ξὺν νηὶ κατήλυθον ἠδʼ ἑτάροισιν"
  - citation: "1.183"
    sequence: 183
    greek: "πλέων ἐπὶ οἴνοπα πόντον ἐπʼ ἀλλοθρόους ἀνθρώπους"
  - citation: "1.184"
    sequence: 184
    greek: "ἐς Τεμέσην μετὰ χαλκόν ἄγω δʼ αἴθωνα σίδηρον"
  - citation: "1.185"
    sequence: 185
    greek: "νηῦς δέ μοι ἥδʼ ἕστηκεν ἐπʼ ἀγροῦ νόσφι πόληος"
  - citation: "1.186"
    sequence: 186
    greek: "ἐν λιμένι Ῥείθρῳ ὑπὸ Νηίῳ ὑλήεντι"
  - citation: "1.187"
    sequence: 187
    greek: "ξεῖνοι δʼ ἀλλήλων πατρώιοι εὐχόμεθʼ εἶναι"
  - citation: "1.188"
    sequence: 188
    greek: "ἐξ ἀρχῆς εἴ πέρ τε γέροντʼ εἴρηαι ἐπελθὼν"
  - citation: "1.189"
    sequence: 189
    greek: "Λαέρτην ἥρωα τὸν οὐκέτι φασὶ πόλινδε"
  - citation: "1.190"
    sequence: 190
    greek: "ἔρχεσθʼ ἀλλʼ ἀπάνευθεν ἐπʼ ἀγροῦ πήματα πάσχειν"
  - citation: "1.191"
    sequence: 191
    greek: "γρηὶ σὺν ἀμφιπόλῳ ἥ οἱ βρῶσίν τε πόσιν τε"
  - citation: "1.192"
    sequence: 192
    greek: "παρτιθεῖ εὖτʼ ἄν μιν κάματος κατὰ γυῖα λάβῃσιν"
  - citation: "1.193"
    sequence: 193
    greek: "ἑρπύζοντʼ ἀνὰ γουνὸν ἀλωῆς οἰνοπέδοιο"
  - citation: "1.194"
    sequence: 194
    greek: "νῦν δʼ ἦλθον δὴ γάρ μιν ἔφαντʼ ἐπιδήμιον εἶναι"
  - citation: "1.195"
    sequence: 195
    greek: "σὸν πατέρʼ ἀλλά νυ τόν γε θεοὶ βλάπτουσι κελεύθου"
  - citation: "1.196"
    sequence: 196
    greek: "οὐ γάρ πω τέθνηκεν ἐπὶ χθονὶ δῖος Ὀδυσσεύς"
  - citation: "1.197"
    sequence: 197
    greek: "ἀλλʼ ἔτι που ζωὸς κατερύκεται εὐρέι πόντῳ"
  - citation: "1.198"
    sequence: 198
    greek: "νήσῳ ἐν ἀμφιρύτῃ χαλεποὶ δέ μιν ἄνδρες ἔχουσιν"
  - citation: "1.199"
    sequence: 199
    greek: "ἄγριοι οἵ που κεῖνον ἐρυκανόωσʼ ἀέκοντα"
  - citation: "1.200"
    sequence: 200
    greek: "αὐτὰρ νῦν τοι ἐγὼ μαντεύσομαι ὡς ἐνὶ θυμῷ"
  - citation: "1.201"
    sequence: 201
    greek: "ἀθάνατοι βάλλουσι καὶ ὡς τελέεσθαι ὀίω"
  - citation: "1.202"
    sequence: 202
    greek: "οὔτε τι μάντις ἐὼν οὔτʼ οἰωνῶν σάφα εἰδώς"
  - citation: "1.203"
    sequence: 203
    greek: "οὔ τοι ἔτι δηρόν γε φίλης ἀπὸ πατρίδος αἴης"
  - citation: "1.204"
    sequence: 204
    greek: "ἔσσεται οὐδʼ εἴ πέρ τε σιδήρεα δέσματʼ ἔχῃσιν"
  - citation: "1.205"
    sequence: 205
    greek: "φράσσεται ὥς κε νέηται ἐπεὶ πολυμήχανός ἐστιν"
  - citation: "1.206"
    sequence: 206
    greek: "ἀλλʼ ἄγε μοι τόδε εἰπὲ καὶ ἀτρεκέως κατάλεξον"
  - citation: "1.207"
    sequence: 207
    greek: "εἰ δὴ ἐξ αὐτοῖο τόσος πάϊς εἰς Ὀδυσῆος"
  - citation: "1.208"
    sequence: 208
    greek: "αἰνῶς μὲν κεφαλήν τε καὶ ὄμματα καλὰ ἔοικας"
  - citation: "1.209"
    sequence: 209
    greek: "κείνῳ ἐπεὶ θαμὰ τοῖον ἐμισγόμεθʼ ἀλλήλοισιν"
  - citation: "1.210"
    sequence: 210
    greek: "πρίν γε τὸν ἐς Τροίην ἀναβήμεναι ἔνθα περ ἄλλοι"
  - citation: "1.211"
    sequence: 211
    greek: "Ἀργείων οἱ ἄριστοι ἔβαν κοίλῃς ἐνὶ νηυσίν"
  - citation: "1.212"
    sequence: 212
    greek: "ἐκ τοῦ δʼ οὔτʼ Ὀδυσῆα ἐγὼν ἴδον οὔτʼ ἔμʼ ἐκεῖνος"
  - citation: "1.213"
    sequence: 213
    greek: "τὴν δʼ αὖ Τηλέμαχος πεπνυμένος ἀντίον ηὔδα"
  - citation: "1.214"
    sequence: 214
    greek: "τοιγὰρ ἐγώ τοι ξεῖνε μάλʼ ἀτρεκέως ἀγορεύσω"
  - citation: "1.215"
    sequence: 215
    greek: "μήτηρ μέν τέ μέ φησι τοῦ ἔμμεναι αὐτὰρ ἐγώ γε"
  - citation: "1.216"
    sequence: 216
    greek: "οὐκ οἶδʼ οὐ γάρ πώ τις ἑὸν γόνον αὐτὸς ἀνέγνω"
  - citation: "1.217"
    sequence: 217
    greek: "ὡς δὴ ἐγώ γʼ ὄφελον μάκαρός νύ τευ ἔμμεναι υἱὸς"
  - citation: "1.218"
    sequence: 218
    greek: "ἀνέρος ὃν κτεάτεσσιν ἑοῖς ἔπι γῆρας ἔτετμε"
  - citation: "1.219"
    sequence: 219
    greek: "νῦν δʼ ὃς ἀποτμότατος γένετο θνητῶν ἀνθρώπων"
  - citation: "1.220"
    sequence: 220
    greek: "τοῦ μʼ ἔκ φασι γενέσθαι ἐπεὶ σύ με τοῦτʼ ἐρεείνεις"
  - citation: "1.221"
    sequence: 221
    greek: "τὸν δʼ αὖτε προσέειπε θεά γλαυκῶπις Ἀθήνη"
  - citation: "1.222"
    sequence: 222
    greek: "οὐ μέν τοι γενεήν γε θεοὶ νώνυμνον ὀπίσσω"
  - citation: "1.223"
    sequence: 223
    greek: "θῆκαν ἐπεὶ σέ γε τοῖον ἐγείνατο Πηνελόπεια"
  - citation: "1.224"
    sequence: 224
    greek: "ἀλλʼ ἄγε μοι τόδε εἰπὲ καὶ ἀτρεκέως κατάλεξον"
  - citation: "1.225"
    sequence: 225
    greek: "τίς δαίς τίς δὲ ὅμιλος ὅδʼ ἔπλετο τίπτε δέ σε χρεώ"
  - citation: "1.226"
    sequence: 226
    greek: "εἰλαπίνη ἠὲ γάμος ἐπεὶ οὐκ ἔρανος τάδε γʼ ἐστίν"
  - citation: "1.227"
    sequence: 227
    greek: "ὥς τέ μοι ὑβρίζοντες ὑπερφιάλως δοκέουσι"
  - citation: "1.228"
    sequence: 228
    greek: "δαίνυσθαι κατὰ δῶμα νεμεσσήσαιτό κεν ἀνὴρ"
  - citation: "1.229"
    sequence: 229
    greek: "αἴσχεα πόλλʼ ὁρόων ὅς τις πινυτός γε μετέλθοι"
  - citation: "1.230"
    sequence: 230
    greek: "τὴν δʼ αὖ Τηλέμαχος πεπνυμένος ἀντίον ηὔδα"
  - citation: "1.231"
    sequence: 231
    greek: "ξεῖνʼ ἐπεὶ ἂρ δὴ ταῦτά μʼ ἀνείρεαι ἠδὲ μεταλλᾷς"
  - citation: "1.232"
    sequence: 232
    greek: "μέλλεν μέν ποτε οἶκος ὅδʼ ἀφνειὸς καὶ ἀμύμων"
  - citation: "1.233"
    sequence: 233
    greek: "ἔμμεναι ὄφρʼ ἔτι κεῖνος ἀνὴρ ἐπιδήμιος ἦεν"
  - citation: "1.234"
    sequence: 234
    greek: "νῦν δʼ ἑτέρως ἐβόλοντο θεοὶ κακὰ μητιόωντες"
  - citation: "1.235"
    sequence: 235
    greek: "οἳ κεῖνον μὲν ἄιστον ἐποίησαν περὶ πάντων"
  - citation: "1.236"
    sequence: 236
    greek: "ἀνθρώπων ἐπεὶ οὔ κε θανόντι περ ὧδʼ ἀκαχοίμην"
  - citation: "1.237"
    sequence: 237
    greek: "εἰ μετὰ οἷς ἑτάροισι δάμη Τρώων ἐνὶ δήμῳ"
  - citation: "1.238"
    sequence: 238
    greek: "ἠὲ φίλων ἐν χερσίν ἐπεὶ πόλεμον τολύπευσεν"
  - citation: "1.239"
    sequence: 239
    greek: "τῷ κέν οἱ τύμβον μὲν ἐποίησαν Παναχαιοί"
  - citation: "1.240"
    sequence: 240
    greek: "ἠδέ κε καὶ ᾧ παιδὶ μέγα κλέος ἤρατʼ ὀπίσσω"
  - citation: "1.241"
    sequence: 241
    greek: "νῦν δέ μιν ἀκλειῶς ἅρπυιαι ἀνηρείψαντο"
  - citation: "1.242"
    sequence: 242
    greek: "οἴχετʼ ἄιστος ἄπυστος ἐμοὶ δʼ ὀδύνας τε γόους τε"
  - citation: "1.243"
    sequence: 243
    greek: "κάλλιπεν οὐδέ τι κεῖνον ὀδυρόμενος στεναχίζω"
  - citation: "1.244"
    sequence: 244
    greek: "οἶον ἐπεί νύ μοι ἄλλα θεοὶ κακὰ κήδεʼ ἔτευξαν"
  - citation: "1.245"
    sequence: 245
    greek: "ὅσσοι γὰρ νήσοισιν ἐπικρατέουσιν ἄριστοι"
  - citation: "1.246"
    sequence: 246
    greek: "Δουλιχίῳ τε Σάμῃ τε καὶ ὑλήεντι Ζακύνθῳ"
  - citation: "1.247"
    sequence: 247
    greek: "ἠδʼ ὅσσοι κραναὴν Ἰθάκην κάτα κοιρανέουσιν"
  - citation: "1.248"
    sequence: 248
    greek: "τόσσοι μητέρʼ ἐμὴν μνῶνται τρύχουσι δὲ οἶκον"
  - citation: "1.249"
    sequence: 249
    greek: "ἡ δʼ οὔτʼ ἀρνεῖται στυγερὸν γάμον οὔτε τελευτὴν"
  - citation: "1.250"
    sequence: 250
    greek: "ποιῆσαι δύναται τοὶ δὲ φθινύθουσιν ἔδοντες"
  - citation: "1.251"
    sequence: 251
    greek: "οἶκον ἐμόν τάχα δή με διαρραίσουσι καὶ αὐτόν"
  - citation: "1.252"
    sequence: 252
    greek: "τὸν δʼ ἐπαλαστήσασα προσηύδα Παλλὰς Ἀθήνη"
  - citation: "1.253"
    sequence: 253
    greek: "ὢ πόποι ἦ δὴ πολλὸν ἀποιχομένου Ὀδυσῆος"
  - citation: "1.254"
    sequence: 254
    greek: "δεύῃ ὅ κε μνηστῆρσιν ἀναιδέσι χεῖρας ἐφείη"
  - citation: "1.255"
    sequence: 255
    greek: "εἰ γὰρ νῦν ἐλθὼν δόμου ἐν πρώτῃσι θύρῃσι"
  - citation: "1.256"
    sequence: 256
    greek: "σταίη ἔχων πήληκα καὶ ἀσπίδα καὶ δύο δοῦρε"
  - citation: "1.257"
    sequence: 257
    greek: "τοῖος ἐὼν οἷόν μιν ἐγὼ τὰ πρῶτʼ ἐνόησα"
  - citation: "1.258"
    sequence: 258
    greek: "οἴκῳ ἐν ἡμετέρῳ πίνοντά τε τερπόμενόν τε"
  - citation: "1.259"
    sequence: 259
    greek: "ἐξ Ἐφύρης ἀνιόντα παρʼ Ἴλου Μερμερίδαο"
  - citation: "1.260"
    sequence: 260
    greek: "ᾤχετο γὰρ καὶ κεῖσε θοῆς ἐπὶ νηὸς Ὀδυσσεὺς"
  - citation: "1.261"
    sequence: 261
    greek: "φάρμακον ἀνδροφόνον διζήμενος ὄφρα οἱ εἴη"
  - citation: "1.262"
    sequence: 262
    greek: "ἰοὺς χρίεσθαι χαλκήρεας ἀλλʼ ὁ μὲν οὔ οἱ"
  - citation: "1.263"
    sequence: 263
    greek: "δῶκεν ἐπεί ῥα θεοὺς νεμεσίζετο αἰὲν ἐόντας"
  - citation: "1.264"
    sequence: 264
    greek: "ἀλλὰ πατήρ οἱ δῶκεν ἐμός φιλέεσκε γὰρ αἰνῶς"
  - citation: "1.265"
    sequence: 265
    greek: "τοῖος ἐὼν μνηστῆρσιν ὁμιλήσειεν Ὀδυσσεύς"
  - citation: "1.266"
    sequence: 266
    greek: "πάντες κʼ ὠκύμοροί τε γενοίατο πικρόγαμοί τε"
  - citation: "1.267"
    sequence: 267
    greek: "ἀλλʼ ἦ τοι μὲν ταῦτα θεῶν ἐν γούνασι κεῖται"
  - citation: "1.268"
    sequence: 268
    greek: "ἤ κεν νοστήσας ἀποτίσεται ἦε καὶ οὐκί"
  - citation: "1.269"
    sequence: 269
    greek: "οἷσιν ἐνὶ μεγάροισι σὲ δὲ φράζεσθαι ἄνωγα"
  - citation: "1.270"
    sequence: 270
    greek: "ὅππως κε μνηστῆρας ἀπώσεαι ἐκ μεγάροιο"
  - citation: "1.271"
    sequence: 271
    greek: "εἰ δʼ ἄγε νῦν ξυνίει καὶ ἐμῶν ἐμπάζεο μύθων"
  - citation: "1.272"
    sequence: 272
    greek: "αὔριον εἰς ἀγορὴν καλέσας ἥρωας Ἀχαιοὺς"
  - citation: "1.273"
    sequence: 273
    greek: "μῦθον πέφραδε πᾶσι θεοὶ δʼ ἐπὶ μάρτυροι ἔστων"
  - citation: "1.274"
    sequence: 274
    greek: "μνηστῆρας μὲν ἐπὶ σφέτερα σκίδνασθαι ἄνωχθι"
  - citation: "1.275"
    sequence: 275
    greek: "μητέρα δʼ εἴ οἱ θυμὸς ἐφορμᾶται γαμέεσθαι"
  - citation: "1.276"
    sequence: 276
    greek: "ἂψ ἴτω ἐς μέγαρον πατρὸς μέγα δυναμένοιο"
  - citation: "1.277"
    sequence: 277
    greek: "οἱ δὲ γάμον τεύξουσι καὶ ἀρτυνέουσιν ἔεδνα"
  - citation: "1.278"
    sequence: 278
    greek: "πολλὰ μάλʼ ὅσσα ἔοικε φίλης ἐπὶ παιδὸς ἕπεσθαι"
  - citation: "1.279"
    sequence: 279
    greek: "σοὶ δʼ αὐτῷ πυκινῶς ὑποθήσομαι αἴ κε πίθηαι"
  - citation: "1.280"
    sequence: 280
    greek: "νῆʼ ἄρσας ἐρέτῃσιν ἐείκοσιν ἥ τις ἀρίστη"
  - citation: "1.281"
    sequence: 281
    greek: "ἔρχεο πευσόμενος πατρὸς δὴν οἰχομένοιο"
  - citation: "1.282"
    sequence: 282
    greek: "ἤν τίς τοι εἴπῃσι βροτῶν ἢ ὄσσαν ἀκούσῃς"
  - citation: "1.283"
    sequence: 283
    greek: "ἐκ Διός ἥ τε μάλιστα φέρει κλέος ἀνθρώποισι"
  - citation: "1.284"
    sequence: 284
    greek: "πρῶτα μὲν ἐς Πύλον ἐλθὲ καὶ εἴρεο Νέστορα δῖον"
  - citation: "1.285"
    sequence: 285
    greek: "κεῖθεν δὲ Σπάρτηνδε παρὰ ξανθὸν Μενέλαον"
  - citation: "1.286"
    sequence: 286
    greek: "ὃς γὰρ δεύτατος ἦλθεν Ἀχαιῶν χαλκοχιτώνων"
  - citation: "1.287"
    sequence: 287
    greek: "εἰ μέν κεν πατρὸς βίοτον καὶ νόστον ἀκούσῃς"
  - citation: "1.288"
    sequence: 288
    greek: "ἦ τʼ ἂν τρυχόμενός περ ἔτι τλαίης ἐνιαυτόν"
  - citation: "1.289"
    sequence: 289
    greek: "εἰ δέ κε τεθνηῶτος ἀκούσῃς μηδʼ ἔτʼ ἐόντος"
  - citation: "1.290"
    sequence: 290
    greek: "νοστήσας δὴ ἔπειτα φίλην ἐς πατρίδα γαῖαν"
  - citation: "1.291"
    sequence: 291
    greek: "σῆμά τέ οἱ χεῦαι καὶ ἐπὶ κτέρεα κτερεΐξαι"
  - citation: "1.292"
    sequence: 292
    greek: "πολλὰ μάλʼ ὅσσα ἔοικε καὶ ἀνέρι μητέρα δοῦναι"
  - citation: "1.293"
    sequence: 293
    greek: "αὐτὰρ ἐπὴν δὴ ταῦτα τελευτήσῃς τε καὶ ἔρξῃς"
  - citation: "1.294"
    sequence: 294
    greek: "φράζεσθαι δὴ ἔπειτα κατὰ φρένα καὶ κατὰ θυμὸν"
  - citation: "1.295"
    sequence: 295
    greek: "ὅππως κε μνηστῆρας ἐνὶ μεγάροισι τεοῖσι"
  - citation: "1.296"
    sequence: 296
    greek: "κτείνῃς ἠὲ δόλῳ ἢ ἀμφαδόν οὐδέ τί σε χρὴ"
  - citation: "1.297"
    sequence: 297
    greek: "νηπιάας ὀχέειν ἐπεὶ οὐκέτι τηλίκος ἐσσι"
  - citation: "1.298"
    sequence: 298
    greek: "ἢ οὐκ ἀίεις οἷον κλέος ἔλλαβε δῖος Ὀρέστης"
  - citation: "1.299"
    sequence: 299
    greek: "πάντας ἐπʼ ἀνθρώπους ἐπεὶ ἔκτανε πατροφονῆα"
  - citation: "1.300"
    sequence: 300
    greek: "Αἴγισθον δολόμητιν ὅ οἱ πατέρα κλυτὸν ἔκτα"
  - citation: "1.301"
    sequence: 301
    greek: "καὶ σύ φίλος μάλα γάρ σʼ ὁρόω καλόν τε μέγαν τε"
  - citation: "1.302"
    sequence: 302
    greek: "ἄλκιμος ἔσσʼ ἵνα τίς σε καὶ ὀψιγόνων ἐὺ εἴπῃ"
  - citation: "1.303"
    sequence: 303
    greek: "αὐτὰρ ἐγὼν ἐπὶ νῆα θοὴν κατελεύσομαι ἤδη"
  - citation: "1.304"
    sequence: 304
    greek: "ἠδʼ ἑτάρους οἵ πού με μάλʼ ἀσχαλόωσι μένοντες"
  - citation: "1.305"
    sequence: 305
    greek: "σοὶ δʼ αὐτῷ μελέτω καὶ ἐμῶν ἐμπάζεο μύθων"
  - citation: "1.306"
    sequence: 306
    greek: "τὴν δʼ αὖ Τηλέμαχος πεπνυμένος ἀντίον ηὔδα"
  - citation: "1.307"
    sequence: 307
    greek: "ξεῖνʼ ἦ τοι μὲν ταῦτα φίλα φρονέων ἀγορεύεις"
  - citation: "1.308"
    sequence: 308
    greek: "ὥς τε πατὴρ ᾧ παιδί καὶ οὔ ποτε λήσομαι αὐτῶν"
  - citation: "1.309"
    sequence: 309
    greek: "ἀλλʼ ἄγε νῦν ἐπίμεινον ἐπειγόμενός περ ὁδοῖο"
  - citation: "1.310"
    sequence: 310
    greek: "ὄφρα λοεσσάμενός τε τεταρπόμενός τε φίλον κῆρ"
  - citation: "1.311"
    sequence: 311
    greek: "δῶρον ἔχων ἐπὶ νῆα κίῃς χαίρων ἐνὶ θυμῷ"
  - citation: "1.312"
    sequence: 312
    greek: "τιμῆεν μάλα καλόν ὅ τοι κειμήλιον ἔσται"
  - citation: "1.313"
    sequence: 313
    greek: "ἐξ ἐμεῦ οἷα φίλοι ξεῖνοι ξείνοισι διδοῦσι"
  - citation: "1.314"
    sequence: 314
    greek: "τὸν δʼ ἠμείβετʼ ἔπειτα θεά γλαυκῶπις Ἀθήνη"
  - citation: "1.315"
    sequence: 315
    greek: "μή μʼ ἔτι νῦν κατέρυκε λιλαιόμενόν περ ὁδοῖο"
  - citation: "1.316"
    sequence: 316
    greek: "δῶρον δʼ ὅττι κέ μοι δοῦναι φίλον ἦτορ ἀνώγῃ"
  - citation: "1.317"
    sequence: 317
    greek: "αὖτις ἀνερχομένῳ δόμεναι οἶκόνδε φέρεσθαι"
  - citation: "1.318"
    sequence: 318
    greek: "καὶ μάλα καλὸν ἑλών σοὶ δʼ ἄξιον ἔσται ἀμοιβῆς"
  - citation: "1.319"
    sequence: 319
    greek: "ἡ μὲν ἄρʼ ὣς εἰποῦσʼ ἀπέβη γλαυκῶπις Ἀθήνη"
  - citation: "1.320"
    sequence: 320
    greek: "ὄρνις δʼ ὣς ἀνόπαια διέπτατο τῷ δʼ ἐνὶ θυμῷ"
  - citation: "1.321"
    sequence: 321
    greek: "θῆκε μένος καὶ θάρσος ὑπέμνησέν τέ ἑ πατρὸς"
  - citation: "1.322"
    sequence: 322
    greek: "μᾶλλον ἔτʼ ἢ τὸ πάροιθεν ὁ δὲ φρεσὶν ᾗσι νοήσας"
  - citation: "1.323"
    sequence: 323
    greek: "θάμβησεν κατὰ θυμόν ὀίσατο γὰρ θεὸν εἶναι"
  - citation: "1.324"
    sequence: 324
    greek: "αὐτίκα δὲ μνηστῆρας ἐπῴχετο ἰσόθεος φώς"
  - citation: "1.325"
    sequence: 325
    greek: "τοῖσι δʼ ἀοιδὸς ἄειδε περικλυτός οἱ δὲ σιωπῇ"
  - citation: "1.326"
    sequence: 326
    greek: "ἥατʼ ἀκούοντες ὁ δʼ Ἀχαιῶν νόστον ἄειδε"
  - citation: "1.327"
    sequence: 327
    greek: "λυγρόν ὃν ἐκ Τροίης ἐπετείλατο Παλλὰς Ἀθήνη"
  - citation: "1.328"
    sequence: 328
    greek: "τοῦ δʼ ὑπερωιόθεν φρεσὶ σύνθετο θέσπιν ἀοιδὴν"
  - citation: "1.329"
    sequence: 329
    greek: "κούρη Ἰκαρίοιο περίφρων Πηνελόπεια"
  - citation: "1.330"
    sequence: 330
    greek: "κλίμακα δʼ ὑψηλὴν κατεβήσετο οἷο δόμοιο"
  - citation: "1.331"
    sequence: 331
    greek: "οὐκ οἴη ἅμα τῇ γε καὶ ἀμφίπολοι δύʼ ἕποντο"
  - citation: "1.332"
    sequence: 332
    greek: "ἡ δʼ ὅτε δὴ μνηστῆρας ἀφίκετο δῖα γυναικῶν"
  - citation: "1.333"
    sequence: 333
    greek: "στῆ ῥα παρὰ σταθμὸν τέγεος πύκα ποιητοῖο"
  - citation: "1.334"
    sequence: 334
    greek: "ἄντα παρειάων σχομένη λιπαρὰ κρήδεμνα"
  - citation: "1.335"
    sequence: 335
    greek: "ἀμφίπολος δʼ ἄρα οἱ κεδνὴ ἑκάτερθε παρέστη"
  - citation: "1.336"
    sequence: 336
    greek: "δακρύσασα δʼ ἔπειτα προσηύδα θεῖον ἀοιδόν"
  - citation: "1.337"
    sequence: 337
    greek: "Φήμιε πολλὰ γὰρ ἄλλα βροτῶν θελκτήρια οἶδας"
  - citation: "1.338"
    sequence: 338
    greek: "ἔργʼ ἀνδρῶν τε θεῶν τε τά τε κλείουσιν ἀοιδοί"
  - citation: "1.339"
    sequence: 339
    greek: "τῶν ἕν γέ σφιν ἄειδε παρήμενος οἱ δὲ σιωπῇ"
  - citation: "1.340"
    sequence: 340
    greek: "οἶνον πινόντων ταύτης δʼ ἀποπαύεʼ ἀοιδῆς"
  - citation: "1.341"
    sequence: 341
    greek: "λυγρῆς ἥ τέ μοι αἰεὶ ἐνὶ στήθεσσι φίλον κῆρ"
  - citation: "1.342"
    sequence: 342
    greek: "τείρει ἐπεί με μάλιστα καθίκετο πένθος ἄλαστον"
  - citation: "1.343"
    sequence: 343
    greek: "τοίην γὰρ κεφαλὴν ποθέω μεμνημένη αἰεί"
  - citation: "1.344"
    sequence: 344
    greek: "ἀνδρός τοῦ κλέος εὐρὺ καθʼ Ἑλλάδα καὶ μέσον Ἄργος"
  - citation: "1.345"
    sequence: 345
    greek: "τὴν δʼ αὖ Τηλέμαχος πεπνυμένος ἀντίον ηὔδα"
  - citation: "1.346"
    sequence: 346
    greek: "μῆτερ ἐμή τί τʼ ἄρα φθονέεις ἐρίηρον ἀοιδὸν"
  - citation: "1.347"
    sequence: 347
    greek: "τέρπειν ὅππῃ οἱ νόος ὄρνυται οὔ νύ τʼ ἀοιδοὶ"
  - citation: "1.348"
    sequence: 348
    greek: "αἴτιοι ἀλλά ποθι Ζεὺς αἴτιος ὅς τε δίδωσιν"
  - citation: "1.349"
    sequence: 349
    greek: "ἀνδράσιν ἀλφηστῇσιν ὅπως ἐθέλῃσιν ἑκάστῳ"
  - citation: "1.350"
    sequence: 350
    greek: "τούτῳ δʼ οὐ νέμεσις Δαναῶν κακὸν οἶτον ἀείδειν"
  - citation: "1.351"
    sequence: 351
    greek: "τὴν γὰρ ἀοιδὴν μᾶλλον ἐπικλείουσʼ ἄνθρωποι"
  - citation: "1.352"
    sequence: 352
    greek: "ἥ τις ἀκουόντεσσι νεωτάτη ἀμφιπέληται"
  - citation: "1.353"
    sequence: 353
    greek: "σοὶ δʼ ἐπιτολμάτω κραδίη καὶ θυμὸς ἀκούειν"
  - citation: "1.354"
    sequence: 354
    greek: "οὐ γὰρ Ὀδυσσεὺς οἶος ἀπώλεσε νόστιμον ἦμαρ"
  - citation: "1.355"
    sequence: 355
    greek: "ἐν Τροίῃ πολλοὶ δὲ καὶ ἄλλοι φῶτες ὄλοντο"
  - citation: "1.356"
    sequence: 356
    greek: "ἀλλʼ εἰς οἶκον ἰοῦσα τὰ σʼ αὐτῆς ἔργα κόμιζε"
  - citation: "1.357"
    sequence: 357
    greek: "ἱστόν τʼ ἠλακάτην τε καὶ ἀμφιπόλοισι κέλευε"
  - citation: "1.358"
    sequence: 358
    greek: "ἔργον ἐποίχεσθαι μῦθος δʼ ἄνδρεσσι μελήσει"
  - citation: "1.359"
    sequence: 359
    greek: "πᾶσι μάλιστα δʼ ἐμοί τοῦ γὰρ κράτος ἔστʼ ἐνὶ οἴκῳ"
  - citation: "1.360"
    sequence: 360
    greek: "ἡ μὲν θαμβήσασα πάλιν οἶκόνδε βεβήκει"
  - citation: "1.361"
    sequence: 361
    greek: "παιδὸς γὰρ μῦθον πεπνυμένον ἔνθετο θυμῷ"
  - citation: "1.362"
    sequence: 362
    greek: "ἐς δʼ ὑπερῷʼ ἀναβᾶσα σὺν ἀμφιπόλοισι γυναιξὶ"
  - citation: "1.363"
    sequence: 363
    greek: "κλαῖεν ἔπειτʼ Ὀδυσῆα φίλον πόσιν ὄφρα οἱ ὕπνον"
  - citation: "1.364"
    sequence: 364
    greek: "ἡδὺν ἐπὶ βλεφάροισι βάλε γλαυκῶπις Ἀθήνη"
  - citation: "1.365"
    sequence: 365
    greek: "μνηστῆρες δʼ ὁμάδησαν ἀνὰ μέγαρα σκιόεντα"
  - citation: "1.366"
    sequence: 366
    greek: "πάντες δʼ ἠρήσαντο παραὶ λεχέεσσι κλιθῆναι"
  - citation: "1.367"
    sequence: 367
    greek: "τοῖσι δὲ Τηλέμαχος πεπνυμένος ἤρχετο μύθων"
  - citation: "1.368"
    sequence: 368
    greek: "μητρὸς ἐμῆς μνηστῆρες ὑπέρβιον ὕβριν ἔχοντες"
  - citation: "1.369"
    sequence: 369
    greek: "νῦν μὲν δαινύμενοι τερπώμεθα μηδὲ βοητὺς"
  - citation: "1.370"
    sequence: 370
    greek: "ἔστω ἐπεὶ τόδε καλὸν ἀκουέμεν ἐστὶν ἀοιδοῦ"
  - citation: "1.371"
    sequence: 371
    greek: "τοιοῦδʼ οἷος ὅδʼ ἐστί θεοῖς ἐναλίγκιος αὐδήν"
  - citation: "1.372"
    sequence: 372
    greek: "ἠῶθεν δʼ ἀγορήνδε καθεζώμεσθα κιόντες"
  - citation: "1.373"
    sequence: 373
    greek: "πάντες ἵνʼ ὕμιν μῦθον ἀπηλεγέως ἀποείπω"
  - citation: "1.374"
    sequence: 374
    greek: "ἐξιέναι μεγάρων ἄλλας δʼ ἀλεγύνετε δαῖτας"
  - citation: "1.375"
    sequence: 375
    greek: "ὑμὰ κτήματʼ ἔδοντες ἀμειβόμενοι κατὰ οἴκους"
  - citation: "1.376"
    sequence: 376
    greek: "εἰ δʼ ὕμιν δοκέει τόδε λωίτερον καὶ ἄμεινον"
  - citation: "1.377"
    sequence: 377
    greek: "ἔμμεναι ἀνδρὸς ἑνὸς βίοτον νήποινον ὀλέσθαι"
  - citation: "1.378"
    sequence: 378
    greek: "κείρετʼ ἐγὼ δὲ θεοὺς ἐπιβώσομαι αἰὲν ἐόντας"
  - citation: "1.379"
    sequence: 379
    greek: "αἴ κέ ποθι Ζεὺς δῷσι παλίντιτα ἔργα γενέσθαι"
  - citation: "1.380"
    sequence: 380
    greek: "νήποινοί κεν ἔπειτα δόμων ἔντοσθεν ὄλοισθε"
  - citation: "1.381"
    sequence: 381
    greek: "ὣς ἔφαθʼ οἱ δʼ ἄρα πάντες ὀδὰξ ἐν χείλεσι φύντες"
  - citation: "1.382"
    sequence: 382
    greek: "Τηλέμαχον θαύμαζον ὃ θαρσαλέως ἀγόρευεν"
  - citation: "1.383"
    sequence: 383
    greek: "τὸν δʼ αὖτʼ Ἀντίνοος προσέφη Εὐπείθεος υἱός"
  - citation: "1.384"
    sequence: 384
    greek: "Τηλέμαχʼ ἦ μάλα δή σε διδάσκουσιν θεοὶ αὐτοὶ"
  - citation: "1.385"
    sequence: 385
    greek: "ὑψαγόρην τʼ ἔμεναι καὶ θαρσαλέως ἀγορεύειν"
  - citation: "1.386"
    sequence: 386
    greek: "μὴ σέ γʼ ἐν ἀμφιάλῳ Ἰθάκῃ βασιλῆα Κρονίων"
  - citation: "1.387"
    sequence: 387
    greek: "ποιήσειεν ὅ τοι γενεῇ πατρώιόν ἐστιν"
  - citation: "1.388"
    sequence: 388
    greek: "τὸν δʼ αὖ Τηλέμαχος πεπνυμένος ἀντίον ηὔδα"
  - citation: "1.389"
    sequence: 389
    greek: "Ἀντίνοʼ ἦ καί μοι νεμεσήσεαι ὅττι κεν εἴπω"
  - citation: "1.390"
    sequence: 390
    greek: "καί κεν τοῦτʼ ἐθέλοιμι Διός γε διδόντος ἀρέσθαι"
  - citation: "1.391"
    sequence: 391
    greek: "ἦ φῂς τοῦτο κάκιστον ἐν ἀνθρώποισι τετύχθαι"
  - citation: "1.392"
    sequence: 392
    greek: "οὐ μὲν γάρ τι κακὸν βασιλευέμεν αἶψά τέ οἱ δῶ"
  - citation: "1.393"
    sequence: 393
    greek: "ἀφνειὸν πέλεται καὶ τιμηέστερος αὐτός"
  - citation: "1.394"
    sequence: 394
    greek: "ἀλλʼ ἦ τοι βασιλῆες Ἀχαιῶν εἰσὶ καὶ ἄλλοι"
  - citation: "1.395"
    sequence: 395
    greek: "πολλοὶ ἐν ἀμφιάλῳ Ἰθάκῃ νέοι ἠδὲ παλαιοί"
  - citation: "1.396"
    sequence: 396
    greek: "τῶν κέν τις τόδʼ ἔχῃσιν ἐπεὶ θάνε δῖος Ὀδυσσεύς"
  - citation: "1.397"
    sequence: 397
    greek: "αὐτὰρ ἐγὼν οἴκοιο ἄναξ ἔσομʼ ἡμετέροιο"
  - citation: "1.398"
    sequence: 398
    greek: "καὶ δμώων οὕς μοι ληίσσατο δῖος Ὀδυσσεύς"
  - citation: "1.399"
    sequence: 399
    greek: "τὸν δʼ αὖτʼ Εὐρύμαχος Πολύβου πάϊς ἀντίον ηὔδα"
  - citation: "1.400"
    sequence: 400
    greek: "Τηλέμαχʼ ἦ τοι ταῦτα θεῶν ἐν γούνασι κεῖται"
  - citation: "1.401"
    sequence: 401
    greek: "ὅς τις ἐν ἀμφιάλῳ Ἰθάκῃ βασιλεύσει Ἀχαιῶν"
  - citation: "1.402"
    sequence: 402
    greek: "κτήματα δʼ αὐτὸς ἔχοις καὶ δώμασιν οἷσιν ἀνάσσοις"
  - citation: "1.403"
    sequence: 403
    greek: "μὴ γὰρ ὅ γʼ ἔλθοι ἀνὴρ ὅς τίς σʼ ἀέκοντα βίηφιν"
  - citation: "1.404"
    sequence: 404
    greek: "κτήματʼ ἀπορραίσει Ἰθάκης ἔτι ναιετοώσης"
  - citation: "1.405"
    sequence: 405
    greek: "ἀλλʼ ἐθέλω σε φέριστε περὶ ξείνοιο ἐρέσθαι"
  - citation: "1.406"
    sequence: 406
    greek: "ὁππόθεν οὗτος ἀνήρ ποίης δʼ ἐξ εὔχεται εἶναι"
  - citation: "1.407"
    sequence: 407
    greek: "γαίης ποῦ δέ νύ οἱ γενεὴ καὶ πατρὶς ἄρουρα"
  - citation: "1.408"
    sequence: 408
    greek: "ἠέ τινʼ ἀγγελίην πατρὸς φέρει ἐρχομένοιο"
  - citation: "1.409"
    sequence: 409
    greek: "ἦ ἑὸν αὐτοῦ χρεῖος ἐελδόμενος τόδʼ ἱκάνει"
  - citation: "1.410"
    sequence: 410
    greek: "οἷον ἀναΐξας ἄφαρ οἴχεται οὐδʼ ὑπέμεινε"
  - citation: "1.411"
    sequence: 411
    greek: "γνώμεναι οὐ μὲν γάρ τι κακῷ εἰς ὦπα ἐῴκει"
  - citation: "1.412"
    sequence: 412
    greek: "τὸν δʼ αὖ Τηλέμαχος πεπνυμένος ἀντίον ηὔδα"
  - citation: "1.413"
    sequence: 413
    greek: "Εὐρύμαχʼ ἦ τοι νόστος ἀπώλετο πατρὸς ἐμοῖο"
  - citation: "1.414"
    sequence: 414
    greek: "οὔτʼ οὖν ἀγγελίῃ ἔτι πείθομαι εἴ ποθεν ἔλθοι"
  - citation: "1.415"
    sequence: 415
    greek: "οὔτε θεοπροπίης ἐμπάζομαι ἥν τινα μήτηρ"
  - citation: "1.416"
    sequence: 416
    greek: "ἐς μέγαρον καλέσασα θεοπρόπον ἐξερέηται"
  - citation: "1.417"
    sequence: 417
    greek: "ξεῖνος δʼ οὗτος ἐμὸς πατρώιος ἐκ Τάφου ἐστίν"
  - citation: "1.418"
    sequence: 418
    greek: "Μέντης δʼ Ἀγχιάλοιο δαΐφρονος εὔχεται εἶναι"
  - citation: "1.419"
    sequence: 419
    greek: "υἱός ἀτὰρ Ταφίοισι φιληρέτμοισιν ἀνάσσει"
  - citation: "1.420"
    sequence: 420
    greek: "ὣς φάτο Τηλέμαχος φρεσὶ δʼ ἀθανάτην θεὸν ἔγνω"
  - citation: "1.421"
    sequence: 421
    greek: "οἱ δʼ εἰς ὀρχηστύν τε καὶ ἱμερόεσσαν ἀοιδὴν"
  - citation: "1.422"
    sequence: 422
    greek: "τρεψάμενοι τέρποντο μένον δʼ ἐπὶ ἕσπερον ἐλθεῖν"
  - citation: "1.423"
    sequence: 423
    greek: "τοῖσι δὲ τερπομένοισι μέλας ἐπὶ ἕσπερος ἦλθε"
  - citation: "1.424"
    sequence: 424
    greek: "δὴ τότε κακκείοντες ἔβαν οἶκόνδε ἕκαστος"
  - citation: "1.425"
    sequence: 425
    greek: "Τηλέμαχος δʼ ὅθι οἱ θάλαμος περικαλλέος αὐλῆς"
  - citation: "1.426"
    sequence: 426
    greek: "ὑψηλὸς δέδμητο περισκέπτῳ ἐνὶ χώρῳ"
  - citation: "1.427"
    sequence: 427
    greek: "ἔνθʼ ἔβη εἰς εὐνὴν πολλὰ φρεσὶ μερμηρίζων"
  - citation: "1.428"
    sequence: 428
    greek: "τῷ δʼ ἄρʼ ἅμʼ αἰθομένας δαΐδας φέρε κεδνὰ ἰδυῖα"
  - citation: "1.429"
    sequence: 429
    greek: "Εὐρύκλειʼ Ὦπος θυγάτηρ Πεισηνορίδαο"
  - citation: "1.430"
    sequence: 430
    greek: "τήν ποτε Λαέρτης πρίατο κτεάτεσσιν ἑοῖσιν"
  - citation: "1.431"
    sequence: 431
    greek: "πρωθήβην ἔτʼ ἐοῦσαν ἐεικοσάβοια δʼ ἔδωκεν"
  - citation: "1.432"
    sequence: 432
    greek: "ἶσα δέ μιν κεδνῇ ἀλόχῳ τίεν ἐν μεγάροισιν"
  - citation: "1.433"
    sequence: 433
    greek: "εὐνῇ δʼ οὔ ποτʼ ἔμικτο χόλον δʼ ἀλέεινε γυναικός"
  - citation: "1.434"
    sequence: 434
    greek: "ἥ οἱ ἅμʼ αἰθομένας δαΐδας φέρε καί ἑ μάλιστα"
  - citation: "1.435"
    sequence: 435
    greek: "δμῳάων φιλέεσκε καὶ ἔτρεφε τυτθὸν ἐόντα"
  - citation: "1.436"
    sequence: 436
    greek: "ὤιξεν δὲ θύρας θαλάμου πύκα ποιητοῖο"
  - citation: "1.437"
    sequence: 437
    greek: "ἕζετο δʼ ἐν λέκτρῳ μαλακὸν δʼ ἔκδυνε χιτῶνα"
  - citation: "1.438"
    sequence: 438
    greek: "καὶ τὸν μὲν γραίης πυκιμηδέος ἔμβαλε χερσίν"
  - citation: "1.439"
    sequence: 439
    greek: "ἡ μὲν τὸν πτύξασα καὶ ἀσκήσασα χιτῶνα"
  - citation: "1.440"
    sequence: 440
    greek: "πασσάλῳ ἀγκρεμάσασα παρὰ τρητοῖσι λέχεσσι"
  - citation: "1.441"
    sequence: 441
    greek: "βῆ ῥʼ ἴμεν ἐκ θαλάμοιο θύρην δʼ ἐπέρυσσε κορώνῃ"
  - citation: "1.442"
    sequence: 442
    greek: "ἀργυρέῃ ἐπὶ δὲ κληῖδʼ ἐτάνυσσεν ἱμάντι"
  - citation: "1.443"
    sequence: 443
    greek: "ἔνθʼ ὅ γε παννύχιος κεκαλυμμένος οἰὸς ἀώτῳ"
  - citation: "1.444"
    sequence: 444
    greek: "βούλευε φρεσὶν ᾗσιν ὁδὸν τὴν πέφραδʼ Ἀθήνη"
